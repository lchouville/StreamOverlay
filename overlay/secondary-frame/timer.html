<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Saphirshwartz - Timer</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/timer.css">
<style>
  /* Canvas de reference : 320x110 (taille exacte de la box). */
  body { width: 320px; height: 110px; position: relative; }
  #stage { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div id="stage"></div>

<script src="../shared/stars.js"></script>
<script src="../shared/timer.js"></script>
<script>
  /* Parametres d'URL (source navigateur OBS) :
       ?mode=down|up        compte a rebours (defaut) ou chronometre
       &time=5:00           duree du compte a rebours (s, m:s ou h:m:s)
       &label=PAUSE         texte au-dessus du temps
       &warn=10             passe en orange sous N secondes (0 = jamais)
       &end=C'est parti !   texte affiche a zero
       &manual              ne demarre pas tout seul (Espace pour lancer)
     Par defaut : 5:00, demarre au chargement, clic = +1 min.
     Controles (page focus / interaction OBS) : Espace = start/pause, R = reset.
     Console : timer.start() / pause() / reset() / add(ms) / set(ms). */
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') === 'up' ? 'up' : 'down';

  const timer = createTimer(document.getElementById('stage'), {
    mode,
    duration: parseDuration(params.get('time') || '5:00'),
    label: params.get('label') || '',
    warnAt: params.has('warn') ? Number(params.get('warn')) * 1000 : 10000,
    endText: params.get('end') || ''
  });

  // Clic = +1 minute (compte a rebours uniquement).
  document.addEventListener('click', () => timer.add(60000));

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); timer.toggle(); }
    else if (e.code === 'KeyR') timer.reset();
  });

  // Demarre tout de suite, sauf avec ?manual.
  if (!params.has('manual')) timer.start();
</script>
</body>
</html>
