<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Saphirshwartz - Alerte Follow</title>
<link rel="stylesheet" href="../../shared/theme.css">
<style>
  /* Canvas de reference : 250x60 (taille exacte de la pastille). */
  body { width: 250px; height: 60px; }

  .pill {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    height: 100%;
    padding: 0 0 0 8px;
    background: linear-gradient(180deg, rgba(13,20,64,0.92), rgba(7,11,34,0.92));
    border: 1.5px solid var(--gold);
    border-radius: 30px;
    box-shadow: inset 0 0 10px rgba(217,201,138,0.25), 0 2px 8px rgba(0,0,0,0.5);
    overflow: hidden;
    box-sizing: border-box;
  }

  .icon-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, rgba(217,201,138,0.18), transparent 70%);
    flex-shrink: 0;
    z-index: 1;
  }

  .icon-circle svg { width: 22px; height: 22px; }
</style>
</head>
<body>
  <div class="pill">
    <div class="star-field"></div>
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" fill="#f3e6b3">
        <path d="M12 21s-7.5-4.6-10-9.2C.4 8.6 2 5 5.5 5 8 5 9.6 6.4 12 9c2.4-2.6 4-4 6.5-4C22 5 23.6 8.6 22 11.8 19.5 16.4 12 21 12 21z"/>
      </svg>
    </div>
  </div>

<script src="../../shared/stars.js"></script>
<script>
  document.querySelectorAll('.star-field').forEach(f => spawnStarField(f, 8));
</script>
</body>
</html>
