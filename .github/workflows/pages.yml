name: Deploy overlays to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Seul user/ est publie : les URLs sont <repo>/SaphirSchwarz/... et <repo>/Elwe/... (sans "user/").
      - uses: actions/upload-pages-artifact@v3
        with:
          path: user
      - id: deployment
        uses: actions/deploy-pages@v4
