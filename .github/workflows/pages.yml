name: Deploy overlay to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Seul le dossier overlay/ est publie : les URLs n'incluent donc pas "overlay/".
      - uses: actions/upload-pages-artifact@v3
        with:
          path: overlay
      - id: deployment
        uses: actions/deploy-pages@v4
