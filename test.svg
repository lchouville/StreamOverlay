  <path class="trait gilet" d="M 440,408 L 512,512 L 566,410 L 612,500 L 616,712 L 548,712 L 470,750 L 418,736 L 412,600 L 430,470 Z"/>
  <path class="gilet-ombre" d="M 560,430 L 610,506 L 614,710 L 580,712 C 586,620 580,520 560,430 Z"/>
