  <path class="trait" fill="url(#tartan)" d="M 345,738 L 690,732 C 698,820 708,900 718,984 C 600,996 460,1006 324,1012 C 326,920 334,830 345,738 Z"/>
  <!-- plis : s'ouvrent vers le bas -->
  <g class="fin" stroke-width="2.5" opacity="0.75">
    <path d="M 360,830 L 352,1008 M 385,830 L 380,1007 M 410,830 L 408,1005 M 435,830 L 436,1004 M 460,830 L 464,1002"/>
    <path d="M 485,830 L 492,1000 M 510,830 L 520,999 M 535,830 L 548,997 M 560,830 L 576,995 M 585,830 L 604,993"/>
    <path d="M 610,830 L 632,991 M 635,830 L 660,989 M 660,830 L 688,987"/>
  </g>
  <!-- ombre sous la ceinture et ourlet plus sombre -->
  <path fill="#06121a" opacity="0.45" d="M 345,738 L 690,732 L 692,770 C 580,758 460,760 343,774 Z"/>
  <path fill="#06121a" opacity="0.35" d="M 326,985 C 460,980 600,972 716,962 L 718,984 C 600,996 460,1006 324,1012 Z"/>

