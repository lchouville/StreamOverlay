<?xml version="1.0" encoding="UTF-8"?>
<!-- Calque : Statue équestre d'un chevalier (cheval bardé, bouclier, lance). -->
<!-- Style croquis médiéval avec patine de bronze et piédestal en pierre. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Patine bronze/verdigris pour la statue -->
    <pattern id="bronzePatina" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#6a7a5a"/>
      <circle cx="4" cy="5" r="2" fill="#5a6a4a" opacity="0.6"/>
      <circle cx="9" cy="9" r="1.5" fill="#7a8a6a" opacity="0.5"/>
      <circle cx="2" cy="8" r="1" fill="#4a5a3a" opacity="0.4"/>
    </pattern>

    <!-- Texture pierre (piédestal) -->
    <pattern id="stoneTexture" patternUnits="userSpaceOnUse" width="40" height="30">
      <rect width="40" height="30" fill="#b8a888"/>
      <rect x="2" y="2" width="36" height="12" fill="#c4b59a" stroke="#3a2a1a" stroke-width="1" opacity="0.6"/>
      <rect x="2" y="16" width="17" height="12" fill="#aa9a7a" stroke="#3a2a1a" stroke-width="1" opacity="0.6"/>
      <rect x="21" y="16" width="17" height="12" fill="#c4b59a" stroke="#3a2a1a" stroke-width="1" opacity="0.6"/>
    </pattern>

    <!-- Dégradé pour effet bronze -->
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a8a6a"/>
      <stop offset="50%" stop-color="#5a6a4a"/>
      <stop offset="100%" stop-color="#4a5a3a"/>
    </linearGradient>

    <filter id="sketchyHeavy" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.04" numOctaves="4" seed="42" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <filter id="sketchyMedium" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.07" numOctaves="3" seed="58" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- ======================================================= -->
  <!-- STATUE ÉQUESTRE (Placée sur le côté droit) -->
  <!-- ======================================================= -->
  <g id="statue-chevalier-equestre" transform="translate(2800, 1200) scale(0.95)" opacity="0.95">
    
    <!-- Ombre portée au sol -->
    <ellipse cx="0" cy="420" rx="220" ry="35" fill="#3a2a1a" opacity="0.35" filter="url(#sketchyMedium)"/>

    <!-- ======================================================= -->
    <!-- PIÉDESTAL (Large et massif pour le cheval) -->
    <!-- ======================================================= -->
    <g id="piédestal">
      <!-- Base large -->
      <rect x="-220" y="360" width="440" height="60" 
            fill="#b8a888" stroke="#2a1a0a" stroke-width="4" 
            filter="url(#sketchyHeavy)" opacity="0.95"/>
      <rect x="-220" y="360" width="440" height="60" 
            fill="url(#stoneTexture)" opacity="0.8"/>
      
      <!-- Bloc central -->
      <rect x="-200" y="280" width="400" height="80" 
            fill="#b8a888" stroke="#2a1a0a" stroke-width="4" 
            filter="url(#sketchyHeavy)" opacity="0.95"/>
      <rect x="-200" y="280" width="400" height="80" 
            fill="url(#stoneTexture)" opacity="0.8"/>
      
      <!-- Bloc supérieur (plateforme) -->
      <rect x="-180" y="240" width="360" height="40" 
            fill="#b8a888" stroke="#2a1a0a" stroke-width="4" 
            filter="url(#sketchyHeavy)" opacity="0.95"/>
      <rect x="-180" y="240" width="360" height="40" 
            fill="url(#stoneTexture)" opacity="0.8"/>

      <!-- Inscription / Plaque -->
      <rect x="-100" y="300" width="200" height="40" rx="3" fill="#8a7a6a" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>
      <g stroke="#3a2a1a" stroke-width="2" opacity="0.7" filter="url(#sketchyMedium)">
        <line x1="-80" y1="315" x2="80" y2="315"/>
        <line x1="-60" y1="325" x2="60" y2="325"/>
      </g>

      <!-- Mousse sur le piédestal -->
      <g fill="#6a7a5a" opacity="0.4" filter="url(#sketchyMedium)">
        <ellipse cx="-180" cy="360" rx="20" ry="10"/>
        <ellipse cx="190" cy="390" rx="25" ry="12"/>
        <ellipse cx="0" cy="410" rx="40" ry="10"/>
      </g>
    </g>

    <!-- ======================================================= -->
    <!-- CHEVAL BARDÉ (En armure) -->
    <!-- ======================================================= -->
    <g id="cheval-bardé">
      
      <!-- Jambes arrière (loin) -->
      <path d="M 120,200 L 140,320 L 170,320 L 150,200 Z" fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>
      <path d="M 120,200 L 140,320 L 170,320 L 150,200 Z" fill="url(#bronzePatina)" opacity="0.6"/>
      <!-- Jambes avant (loin) -->
      <path d="M -120,200 L -140,320 L -110,320 L -90,200 Z" fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>
      <path d="M -120,200 L -140,320 L -110,320 L -90,200 Z" fill="url(#bronzePatina)" opacity="0.6"/>

      <!-- Queue -->
      <path d="M 160,150 Q 220,180 200,280 Q 190,300 180,280 Q 190,200 150,170 Z" 
            fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>

      <!-- Corps du cheval (Torse et croupe) -->
      <path d="M -160,120 Q 0,80 160,120 Q 180,180 150,220 L -140,220 Q -180,180 -160,120 Z" 
            fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="4" 
            filter="url(#sketchyHeavy)" opacity="0.95"/>
      <path d="M -160,120 Q 0,80 160,120 Q 180,180 150,220 L -140,220 Q -180,180 -160,120 Z" 
            fill="url(#bronzePatina)" opacity="0.6"/>

      <!-- Caparaçon / Bardure (Armure du cheval) -->
      <g stroke="#2a1a0a" stroke-width="2" opacity="0.7" fill="none" filter="url(#sketchyMedium)">
        <path d="M -150,130 Q 0,90 150,130"/>
        <path d="M -140,160 Q 0,120 140,160"/>
        <path d="M -130,190 Q 0,150 130,190"/>
        <!-- Sangles -->
        <line x1="-50" y1="100" x2="-50" y2="220"/>
        <line x1="50" y1="100" x2="50" y2="220"/>
      </g>

      <!-- Encolure et Tête -->
      <path d="M -160,120 Q -200,80 -220,40 Q -230,20 -210,10 Q -190,0 -180,30 Q -160,70 -140,110 Z" 
            fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="4" 
            filter="url(#sketchyHeavy)" opacity="0.95"/>
      <path d="M -160,120 Q -200,80 -220,40 Q -230,20 -210,10 Q -190,0 -180,30 Q -160,70 -140,110 Z" 
            fill="url(#bronzePatina)" opacity="0.6"/>

      <!-- Chanfron (Armure de la tête) -->
      <path d="M -220,40 L -240,50 L -230,70 L -200,60 Z" 
            fill="#5a6a4a" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>
      <!-- Pointe du chanfron -->
      <path d="M -240,50 L -250,55 L -240,60 Z" fill="#4a5a3a" stroke="#2a1a0a" stroke-width="2"/>
      <!-- illère (trou pour l'œil) -->
      <ellipse cx="-205" cy="35" rx="6" ry="4" fill="#1a0f05" opacity="0.9"/>
      <!-- Oreilles -->
      <path d="M -190,15 L -195,-5 L -180,10 Z" fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="2"/>
      <path d="M -175,20 L -175,0 L -165,15 Z" fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="2"/>

      <!-- Jambes avant (proches) -->
      <!-- Jambe avant gauche (posée) -->
      <path d="M -100,200 L -110,320 Q -110,330 -90,330 L -70,330 Q -60,330 -60,320 L -70,200 Z" 
            fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>
      <!-- Genouillère -->
      <ellipse cx="-80" cy="270" rx="16" ry="10" fill="#5a6a4a" stroke="#2a1a0a" stroke-width="2"/>
      
      <!-- Jambe avant droite (levée - dynamique) -->
      <path d="M -60,200 L -90,260 Q -100,280 -80,290 L -60,290 Q -50,290 -50,270 L -40,200 Z" 
            fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>
      <ellipse cx="-70" cy="250" rx="16" ry="10" fill="#5a6a4a" stroke="#2a1a0a" stroke-width="2"/>

      <!-- Jambes arrière (proches) -->
      <path d="M 100,200 L 90,320 Q 90,330 110,330 L 130,330 Q 140,330 140,320 L 130,200 Z" 
            fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>
      <ellipse cx="110" cy="270" rx="16" ry="10" fill="#5a6a4a" stroke="#2a1a0a" stroke-width="2"/>

      <!-- Crinière (stylisée en métal) -->
      <g fill="#4a5a3a" stroke="#2a1a0a" stroke-width="2" filter="url(#sketchyMedium)">
        <path d="M -160,100 Q -170,80 -150,70 Q -140,90 -150,110 Z"/>
        <path d="M -140,90 Q -150,70 -130,60 Q -120,80 -130,100 Z"/>
        <path d="M -120,85 Q -130,65 -110,55 Q -100,75 -110,95 Z"/>
      </g>
    </g>

    <!-- ======================================================= -->
    <!-- CHEVALIER -->
    <!-- ======================================================= -->
    <g id="chevalier">
      <!-- Jambes du chevalier (sur les flancs) -->
      <path d="M -30,180 L -40,240 Q -40,250 -20,250 L -10,250 Q 0,250 0,240 L 10,180 Z" 
            fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>
      <path d="M 20,180 L 30,240 Q 30,250 50,250 L 60,250 Q 70,250 70,240 L 50,180 Z" 
            fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>
      <!-- Genouillères -->
      <ellipse cx="-20" cy="220" rx="14" ry="9" fill="#5a6a4a" stroke="#2a1a0a" stroke-width="2"/>
      <ellipse cx="50" cy="220" rx="14" ry="9" fill="#5a6a4a" stroke="#2a1a0a" stroke-width="2"/>

      <!-- Torse (Cuirasse) -->
      <path d="M -40,80 Q 0,60 40,80 L 50,180 Q 0,190 -50,180 Z" 
            fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="4" 
            filter="url(#sketchyHeavy)" opacity="0.95"/>
      <path d="M -40,80 Q 0,60 40,80 L 50,180 Q 0,190 -50,180 Z" 
            fill="url(#bronzePatina)" opacity="0.6"/>
      
      <!-- Détails cuirasse -->
      <line x1="0" y1="75" x2="0" y2="185" stroke="#2a1a0a" stroke-width="2" opacity="0.7"/>
      <path d="M -35,110 Q 0,105 35,110" fill="none" stroke="#2a1a0a" stroke-width="2" opacity="0.7"/>
      <path d="M -40,140 Q 0,135 40,140" fill="none" stroke="#2a1a0a" stroke-width="2" opacity="0.7"/>

      <!-- Épaulières (Pauldrons) -->
      <path d="M -50,80 Q -70,90 -65,120 Q -50,130 -40,120 L -35,85 Z" fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>
      <path d="M 40,80 Q 60,90 65,120 Q 50,130 40,120 L 35,85 Z" fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>

      <!-- Bras gauche (tient le bouclier) -->
      <path d="M -60,115 L -80,160 Q -85,170 -70,175 L -50,170 Q -40,165 -45,150 L -35,115 Z" 
            fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>
      
      <!-- Bras droit (tient la lance) -->
      <path d="M 55,115 L 70,150 Q 75,160 60,165 L 40,160 Q 30,155 35,140 L 45,115 Z" 
            fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>
      <!-- Gantelet droit -->
      <circle cx="65" cy="160" r="10" fill="#4a5a3a" stroke="#2a1a0a" stroke-width="2"/>

      <!-- Heaume (Casque) -->
      <path d="M -25,85 L -25,40 Q -25,10 0,10 Q 25,10 25,40 L 25,85 Q 25,95 0,95 Q -25,95 -25,85 Z" 
            fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="4" 
            filter="url(#sketchyHeavy)" opacity="0.95"/>
      <path d="M -25,85 L -25,40 Q -25,10 0,10 Q 25,10 25,40 L 25,85 Q 25,95 0,95 Q -25,95 -25,85 Z" 
            fill="url(#bronzePatina)" opacity="0.6"/>
      
      <!-- Visière -->
      <path d="M -20,45 L -20,65 Q -20,70 0,70 Q 20,70 20,65 L 20,45 Q 20,40 0,40 Q -20,40 -20,45 Z" 
            fill="#1a0f05" opacity="0.85"/>
      <g stroke="#1a0f05" stroke-width="1.5" opacity="0.7">
        <line x1="-10" y1="75" x2="-10" y2="85"/>
        <line x1="0" y1="75" x2="0" y2="85"/>
        <line x1="10" y1="75" x2="10" y2="85"/>
      </g>
      <!-- Cimier (Crête du casque) -->
      <path d="M 0,10 Q 0,-15 0,-25" fill="none" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>
      <path d="M -10,-20 Q 0,-30 10,-20 L 5,-10 L -5,-10 Z" fill="#4a5a3a" stroke="#2a1a0a" stroke-width="2"/>

      <!-- BOUCLIER (Écu chauffé) -->
      <g id="bouclier" transform="translate(-75, 160) rotate(-15)" filter="url(#sketchyMedium)">
        <path d="M -35,-40 L 35,-40 L 45,10 L 0,60 L -45,10 Z" 
              fill="url(#bronzeGrad)" stroke="#2a1a0a" stroke-width="4"/>
        <path d="M -35,-40 L 35,-40 L 45,10 L 0,60 L -45,10 Z" 
              fill="url(#bronzePatina)" opacity="0.5"/>
        <!-- Bordure du bouclier -->
        <path d="M -25,-30 L 25,-30 L 32,10 L 0,48 L -32,10 Z" 
              fill="none" stroke="#2a1a0a" stroke-width="2"/>
        <!-- Héraldique : Lion rampant stylisé -->
        <path d="M -10,-10 Q 10,-20 15,0 Q 20,20 0,30 Q -15,20 -10,0 Z" 
              fill="#4a5a3a" stroke="#2a1a0a" stroke-width="2"/>
        <path d="M 5,-5 L 15,-15 M 5,5 L 15,5 M 0,15 L 10,25" stroke="#2a1a0a" stroke-width="2" fill="none"/>
      </g>
    </g>

    <!-- ======================================================= -->
    <!-- LANCE ET FANION -->
    <!-- ======================================================= -->
    <g id="lance-fanion" filter="url(#sketchyMedium)">
      <!-- La Lance (longue tige diagonale) -->
      <line x1="65" y1="160" x2="-280" y2="-250" stroke="#5a4a3a" stroke-width="8" stroke-linecap="round"/>
      <line x1="65" y1="160" x2="-280" y2="-250" stroke="#3a2a1a" stroke-width="2" opacity="0.5"/>
      
      <!-- Pointe de la lance -->
      <path d="M -280,-250 L -310,-280 L -270,-260 Z" fill="#8a8a8a" stroke="#2a1a0a" stroke-width="2"/>
      
      <!-- Fanion (Drapeau triangulaire au bout de la lance) -->
      <path d="M -280,-250 Q -330,-270 -380,-240 Q -330,-230 -280,-250 Z" 
            fill="#a04030" stroke="#2a1a0a" stroke-width="3" opacity="0.9"/>
      <!-- Héraldique sur le fanion -->
      <path d="M -310,-255 L -300,-245 L -320,-245 Z" fill="#d4ba82" opacity="0.8"/>
      <path d="M -340,-245 L -330,-235 L -350,-235 Z" fill="#d4ba82" opacity="0.8"/>
      <!-- Pliures du tissu -->
      <path d="M -300,-250 Q -320,-240 -340,-245" fill="none" stroke="#2a1a0a" stroke-width="1.5" opacity="0.6"/>
      <path d="M -320,-255 Q -340,-245 -360,-240" fill="none" stroke="#2a1a0a" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- ======================================================= -->
    <!-- DÉTAILS DE PATINE ET VIEILLISSEMENT -->
    <!-- ======================================================= -->
    <g fill="#4a6a4a" opacity="0.5" filter="url(#sketchyMedium)">
      <ellipse cx="-180" cy="150" rx="15" ry="10"/>
      <ellipse cx="120" cy="180" rx="12" ry="8"/>
      <ellipse cx="-210" cy="60" rx="10" ry="6"/>
      <ellipse cx="20" cy="120" rx="14" ry="9"/>
      <ellipse cx="0" cy="30" rx="8" ry="5"/>
    </g>

    <!-- Fientes d'oiseaux (réalisme de statue extérieure) -->
    <ellipse cx="-15" cy="15" rx="8" ry="4" fill="#e4d4b4" opacity="0.5" filter="url(#sketchyMedium)"/>
    <ellipse cx="140" cy="130" rx="6" ry="3" fill="#e4d4b4" opacity="0.4" filter="url(#sketchyMedium)"/>

  </g>
</svg>