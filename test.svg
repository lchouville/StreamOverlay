  <g class="trait" stroke-width="2" fill="#4a4a4e">
    <circle cx="524" cy="530" r="6"/><circle cx="525" cy="568" r="6"/><circle cx="526" cy="606" r="6"/>
    <circle cx="527" cy="644" r="6"/><circle cx="528" cy="682" r="6"/>
  </g>
  <!-- poches a rabat -->
  <path class="trait" stroke-width="3" fill="#2a2a2c" d="M 456,648 L 500,646 L 500,662 L 456,665 Z"/>
  <path class="trait" stroke-width="3" fill="#2a2a2c" d="M 552,646 L 598,644 L 598,660 L 552,662 Z"/>
  <!-- chaine de montre -->
  <path d="M 470,662 Q 480,700 497,692 Q 508,676 524,644" fill="none" stroke="#c9c9cc" stroke-width="3" stroke-dasharray="3 2.5"/>

  <!-- col de chemise -->
  <path class="trait chemise" d="M 470,342 L 446,388 L 494,410 L 506,376 Z"/>
  <path class="trait chemise" d="M 546,342 L 568,388 L 522,410 L 510,376 Z"/>
  <path class="chemise-ombre" d="M 472,350 L 500,378 L 492,404 L 478,398 Z"/>
  <!-- cravate verte -->
  <path class="trait veste" d="M 494,378 L 524,378 L 518,404 L 500,404 Z"/>
  <path class="trait veste" d="M 500,404 L 518,404 L 530,486 L 509,506 L 490,486 Z"/>
  <path class="veste-reflet" d="M 504,410 L 512,410 L 516,480 L 506,488 Z"/>

  <!-- revers de la veste + pochette doree -->
  <path class="trait veste" d="M 454,374 L 406,448 L 428,458 L 416,476 L 468,606 L 430,470 L 440,410 Z"/>
  <path class="trait veste" d="M 560,378 L 606,450 L 586,458 L 600,478 L 616,602 L 612,500 L 566,410 Z"/>
  <path class="trait" stroke-width="3" fill="#cfae66" d="M 366,466 L 410,462 L 411,472 L 367,476 Z"/>

  <!-- ================================================= MANCHES + MAINS -->
  <!-- manches : epaule tombante, coude ecarte, l'avant-bras revient vers la ceinture -->
  <path class="trait veste" d="M 336,398 C 300,400 276,428 262,480 C 250,520 242,560 242,600 C 242,646 262,686 292,708 L 348,716 C 336,690 326,650 326,606 C 326,560 334,510 336,470 C 338,440 340,418 336,398 Z"/>
  <path class="veste-reflet" d="M 296,428 C 278,470 266,520 262,580 C 274,530 286,486 310,444 Z"/>
  <path class="veste-ombre" d="M 326,560 C 322,620 326,670 340,712 L 348,716 C 336,690 326,650 326,606 Z"/>
  <path class="fin" d="M 256,628 Q 278,620 296,634 M 256,660 Q 276,652 294,668"/>

  <path class="trait veste" d="M 650,410 C 684,418 704,456 712,510 C 718,550 722,590 720,630 C 718,670 706,698 690,716 L 640,714 C 650,686 656,650 656,610 C 656,560 650,510 650,470 C 650,446 648,426 650,410 Z"/>
  <path class="veste-ombre" d="M 694,470 C 708,520 716,580 714,640 C 710,680 700,704 690,716 L 676,714 C 694,670 700,560 694,470 Z"/>
  <path class="fin" d="M 664,640 Q 684,632 702,646"/>

  <!-- poignets de chemise + montre -->
  <path class="trait chemise" d="M 330,700 L 366,706 L 362,730 L 326,724 Z"/>
  <path class="trait chemise" d="M 636,706 L 674,706 L 676,730 L 638,730 Z"/>
  <rect class="trait" stroke-width="2" x="664" y="706" width="12" height="22" rx="3" fill="#2a2a2c"/>

  <!-- poings (pouces vers l'avant, poses sur la ceinture du kilt) -->
  <path class="trait peau" d="M 350,716 C 344,742 366,768 396,764 C 422,762 434,742 430,720 C 426,704 404,700 386,705 C 368,706 354,706 350,716 Z"/>
  <path class="peau-ombre" d="M 360,744 C 372,760 400,764 420,754 C 404,768 372,766 360,744 Z"/>
  <path class="fin" stroke-width="2.5" d="M 372,722 Q 386,716 398,726 M 380,738 Q 392,732 408,740 M 404,716 Q 420,722 422,738"/>
  <path class="trait peau" d="M 590,712 C 588,742 610,764 636,760 C 656,756 664,736 656,716 C 648,700 626,700 610,703 C 598,705 592,708 590,712 Z"/>
  <path class="peau-ombre" d="M 600,742 C 612,758 634,762 650,750 C 640,764 612,764 600,742 Z"/>
  <path class="fin" stroke-width="2.5" d="M 612,722 Q 626,716 638,726 M 604,738 Q 618,732 632,740 M 598,716 Q 594,730 600,740"/>

  <!-- ================================================= TETE -->
  <path class="trait peau-ombre" d="M 472,310 L 472,372 C 490,382 528,382 544,372 L 544,310 Z"/>
  <!-- oreilles -->
  <ellipse class="trait peau" cx="444" cy="248" rx="13" ry="21"/>
  <ellipse class="trait peau" cx="572" cy="246" rx="13" ry="21"/>
  <path class="fin" stroke-width="2.5" d="M 446,238 Q 438,248 446,258 M 570,236 Q 578,246 570,256"/>
  <!-- visage -->
  <path class="trait peau" d="M 446,214 C 442,282 462,332 504,346 C 546,344 570,300 572,224 C 570,184 546,164 506,164 C 470,164 446,184 446,214 Z"/>
  <path class="peau-ombre" opacity="0.7" d="M 450,240 C 452,290 470,326 500,342 C 476,322 462,290 460,246 Z"/>
  <!-- barbe de quelques jours + moustache -->
  <path fill="#9c6640" opacity="0.6" d="M 450,262 C 456,316 480,344 505,346 C 538,345 562,312 568,262 C 560,292 546,312 526,316 Q 507,322 488,316 C 470,310 457,292 450,262 Z"/>
  <path fill="#9c6640" opacity="0.7" d="M 486,294 Q 506,284 528,294 Q 507,299 486,294 Z"/>
  <path fill="#9c6640" opacity="0.6" d="M 498,314 Q 507,330 516,314 Z"/>
  <!-- cheveux : cote courts, houppe vers l'arriere -->
  <!-- cheveux : cotes courts, houppe en meches relevees vers l'arriere -->
  <path class="trait cheveux" d="M 444,240 C 436,206 440,176 456,160 L 452,146 L 468,150 C 472,134 486,126 500,128 L 498,116 L 516,124 C 526,116 542,118 548,128 L 562,124 L 560,140 C 576,150 582,180 574,236 C 570,212 564,196 550,190 C 528,184 494,190 470,180 C 458,194 450,214 448,240 Z"/>
  <path class="cheveux-ombre" d="M 450,230 C 446,200 452,176 468,162 C 462,186 456,208 456,234 Z"/>
  <path class="cheveux-ombre" d="M 470,180 C 494,190 528,184 550,190 C 562,196 568,206 572,222 C 560,200 530,194 500,196 C 486,194 476,190 470,180 Z"/>
  <path class="fin" stroke="#2a160c" stroke-width="2.5" d="M 474,160 Q 492,140 516,138 M 480,174 Q 506,152 540,150 M 530,132 Q 556,142 566,172 M 498,170 Q 522,160 552,168"/>
  <path d="M 486,146 Q 500,136 516,136" fill="none" stroke="#8a5434" stroke-width="3" stroke-linecap="round"/>
  <!-- sourcils -->
  <path d="M 458,212 Q 476,202 496,210" fill="none" stroke="#3a2014" stroke-width="6" stroke-linecap="round"/>
  <path d="M 518,210 Q 538,202 557,212" fill="none" stroke="#3a2014" stroke-width="6" stroke-linecap="round"/>
  <!-- yeux fermes, souriants -->
  <path class="fin" d="M 464,236 Q 477,244 490,236 M 525,236 Q 538,244 551,236"/>
  <!-- lunettes rectangulaires -->
  <g fill="#ffffff" fill-opacity="0.12" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round">
    <rect x="452" y="216" width="48" height="34" rx="6"/>
    <rect x="514" y="216" width="50" height="34" rx="6"/>
  </g>
  <path d="M 500,228 Q 507,223 514,228 M 452,224 L 440,222 M 564,224 L 576,222" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <!-- nez et sourire en coin -->
  <path class="fin" stroke-width="2.5" d="M 508,240 Q 500,266 504,278 Q 511,283 518,277"/>
  <path class="fin" d="M 489,300 Q 506,308 524,297"/>
</svg>
