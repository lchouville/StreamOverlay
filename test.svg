<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" width="1024" height="1536">
  <!-- Personnage en tenue ecossaise (veste verte, gilet noir, kilt tartan, chaussettes de laine), -->
  <!-- style BD : contours noirs epais, aplats + ombres franches. Coordonnees calees sur image.png. -->
  <defs>
    <style>
      .trait { stroke: #141414; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .fin { stroke: #141414; stroke-width: 3; stroke-linecap: round; fill: none; }
      .peau { fill: #f2c4a2; }
      .peau-ombre { fill: #d99a7a; }
      .veste { fill: #0f4a3e; }
      .veste-ombre { fill: #0a3229; }
      .veste-reflet { fill: #1c6453; }
      .gilet { fill: #1d1d1f; }
      .gilet-ombre { fill: #111112; }
      .chemise { fill: #f4f1ea; }
      .chemise-ombre { fill: #d6d2c8; }
      .laine { fill: #efe8cc; }
      .laine-ombre { fill: #d5cba6; }
      .cuir { fill: #8e6a44; }
      .cheveux { fill: #5a3220; }
      .cheveux-ombre { fill: #3a2014; }
    </style>

    <!-- Tartan bleu nuit / vert, filets jaune et violet (comme le kilt de l'image) -->
    <pattern id="tartan" x="330" y="745" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="translate(-60,-40) scale(1.7)">
      <rect width="120" height="120" fill="#183a48"/>
      <rect x="0" y="0" width="52" height="120" fill="#0f4a3e" opacity="0.6"/>
      <rect x="0" y="0" width="120" height="52" fill="#0f4a3e" opacity="0.6"/>
      <rect x="72" y="0" width="30" height="120" fill="#081820" opacity="0.55"/>
      <rect x="0" y="72" width="120" height="30" fill="#081820" opacity="0.55"/>
      <rect x="58" y="0" width="3" height="120" fill="#cdb873"/>
      <rect x="0" y="58" width="120" height="3" fill="#cdb873"/>
      <rect x="110" y="0" width="2" height="120" fill="#6b5a8e"/>
      <rect x="0" y="110" width="120" height="2" fill="#6b5a8e"/>
    </pattern>
    <!-- Cotes de la laine (chaussettes) -->
    <pattern id="cotes" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#efe8cc"/>
      <rect x="9" width="2.5" height="12" fill="#d5cba6"/>
    </pattern>
    <pattern id="cotes-revers" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f4eed6"/>
      <rect x="10" width="3" height="14" fill="#dcd2b0"/>
    </pattern>
  </defs>

  <!-- ================================================= JAMBES -->
  <!-- cuisses / genoux (sous le kilt) -->
  <path class="trait peau" d="M 372,995 L 448,995 L 456,1080 L 356,1084 Z"/>
  <path class="trait peau" d="M 584,995 L 652,995 L 688,1074 L 582,1074 Z"/>
  <path class="peau-ombre" d="M 420,1000 L 446,1000 L 452,1076 L 432,1078 Z"/>
  <path class="peau-ombre" d="M 630,1000 L 650,1000 L 684,1070 L 660,1072 Z"/>
  <path class="fin" d="M 392,1040 Q 404,1032 416,1042 M 604,1036 Q 616,1028 628,1038"/>

  <!-- chaussettes montantes : tube cotele + revers replie -->
  <path class="trait" fill="url(#cotes)" d="M 360,1110 C 362,1170 372,1240 378,1296 L 442,1300 C 442,1240 450,1170 455,1112 Z"/>
  <path class="laine-ombre" opacity="0.6" d="M 425,1114 L 455,1112 C 450,1170 442,1240 442,1300 L 428,1298 C 430,1230 434,1170 425,1114 Z"/>
  <path class="trait" fill="url(#cotes-revers)" d="M 352,1068 C 380,1060 430,1062 460,1070 L 457,1118 C 425,1112 385,1112 357,1118 Z"/>
  <path class="trait" fill="url(#cotes)" d="M 585,1108 C 594,1170 606,1235 614,1292 L 680,1290 C 680,1230 684,1170 686,1106 Z"/>
  <path class="laine-ombre" opacity="0.6" d="M 655,1108 L 686,1106 C 684,1170 680,1230 680,1290 L 664,1290 C 664,1230 662,1170 655,1108 Z"/>
  <path class="trait" fill="url(#cotes-revers)" d="M 578,1062 C 610,1054 660,1054 690,1060 L 687,1110 C 655,1104 615,1104 584,1112 Z"/>

  <!-- chaussures en daim creme, semelle cuir -->
  <path class="trait cuir" d="M 328,1362 C 330,1386 400,1392 446,1376 L 446,1362 Z"/>
  <path class="trait laine" d="M 378,1284 C 346,1302 326,1332 328,1358 C 332,1378 402,1382 446,1366 C 452,1338 448,1304 442,1288 Z"/>
  <path class="laine-ombre" d="M 340,1352 C 360,1366 410,1368 444,1356 L 446,1366 C 402,1382 332,1378 330,1360 Z"/>
  <path class="fin" d="M 362,1310 Q 384,1300 404,1312"/>
  <path class="trait cuir" d="M 612,1338 C 616,1360 690,1370 784,1360 L 784,1346 Z"/>
  <path class="trait laine" d="M 614,1282 L 684,1280 C 716,1298 768,1308 782,1336 C 786,1356 744,1362 690,1358 C 646,1356 616,1348 612,1330 Z"/>
  <path class="laine-ombre" d="M 620,1336 C 650,1348 730,1352 780,1344 L 782,1350 C 744,1360 646,1358 616,1344 Z"/>
  <path class="fin" d="M 690,1300 Q 714,1296 736,1312"/>

  <!-- ================================================= VESTE (pans, derriere le gilet) -->
  <path class="trait veste" d="M 330,402 L 456,384 L 470,410 L 432,470 L 414,620 L 420,742 L 336,838 L 290,830 C 292,720 296,620 300,540 Z"/>
  <path class="trait veste" d="M 562,390 L 652,410 C 678,520 692,640 696,800 L 640,782 L 616,714 L 612,500 Z"/>
