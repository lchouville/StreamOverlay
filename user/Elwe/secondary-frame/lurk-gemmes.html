<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Elwe - Lurk : gemmes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap">
<style>
  /* Lurkers (!lurk / !here) : gemmes magiques qui roulent en bas de l'ecran.
     Source navigateur a part, 1920x1080 transparente, a poser AU-DESSUS des autres sources
     dans chaque scene (debut, live, fin) : la meme page partout, la liste est partagee entre
     scenes (voir elements/lurk/lurk.js).
     Parametres (URL) : ?sol=1078 (y du sol, bas des gemmes), &xmin=12&xmax=1908 (bords).
     Tests : ?lurk=Pseudo1,Pseudo2 (arrivees), &lurk-debug (liste dans un coin). */
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  #gemmes { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
</style>
</head>
<body>
  <div id="gemmes"></div>
<script src="../elements/twitch-chat.js"></script>
<script src="../elements/lurk/lurk.js"></script>
<script src="../elements/lurk/gemmes.js"></script>
<script>
  const param = (nom, defaut) => { const v = parseFloat(new URLSearchParams(location.search).get(nom)); return isNaN(v) ? defaut : v; };
  GemmesLurk(document.getElementById('gemmes'), { sol: param('sol', 1078), xMin: param('xmin', 12), xMax: param('xmax', 1908) });
</script>
</body>
</html>
