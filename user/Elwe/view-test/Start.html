<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Elwe - Start (avant le live)</title>
<style>
  /* Ecran d'attente avant le live : la carte de la ville en fond (meme rendu que full-frame)
     et, a gauche, l'avis de quete sur parchemin (secondary-frame/quest-start-parchemin.html ;
     version futuriste : secondary-frame/quest-start.html, a mettre dans le src de #quete).
     Canvas de reference 1920x1080 ; le fond est rendu en 3840x2160 puis reduit (supersampling). */
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: #000; overflow: hidden; }
  iframe { border: 0; display: block; position: absolute; }
  #fond { width: 3840px; height: 2160px; transform: scale(0.5); transform-origin: top left; }
  #quete { left: 35px; top: -2px; width: 533px; height: 650px; background: transparent; }
</style>
</head>
<body>
  <iframe id="fond" src="../elements/fantasiemap/background/ville-medievale-croquis.svg" title="Fond ville medievale"></iframe>
  <iframe id="quete" src="../secondary-frame/quest-start-parchemin.html" title="Depart de quete" allowtransparency="true"></iframe>
<script>
  // Les parametres de cette page sont transmis aux deux cadres (chacun ne lit que sa propre
  // URL) : ?time=, &titre=, &objectifs=... pour la quete ; &carte=, &seed=, &forme=,
  // #twitch=... pour la carte.
  if (location.search || location.hash) {
    document.querySelectorAll('iframe').forEach(cadre => { cadre.src = cadre.getAttribute('src') + location.search + location.hash; });
  }
</script>
</body>
</html>
