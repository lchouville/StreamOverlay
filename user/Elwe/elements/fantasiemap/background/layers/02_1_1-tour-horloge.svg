<?xml version="1.0" encoding="UTF-8"?>
<!-- Calque : tour horloge style croquis détaillé avec hachures (style Dinan). -->
<!-- Perspective à 2 points de fuite. 3840x2160 (16:9). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- ======================================================= -->
    <!-- MOTIFS DE HACHURES (cross-hatching) -->
    <!-- ======================================================= -->
    
    <!-- Hachures verticales pour le volume cylindrique -->
    <pattern id="hatchCylinder" patternUnits="userSpaceOnUse" width="10" height="10">
      <line x1="5" y1="0" x2="5" y2="10" stroke="#4a3d30" stroke-width="1.2" opacity="0.6"/>
    </pattern>
    
    <!-- Hachures denses pour les ombres profondes (intérieur arcade, toit droit) -->
    <pattern id="hatchDeepShadow" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#2a1a0a" stroke-width="1.5" opacity="0.85"/>
      <line x1="0" y1="0" x2="4" y2="4" stroke="#2a1a0a" stroke-width="1" opacity="0.6"/>
    </pattern>

    <!-- Hachures légères (45°) pour les zones éclairées -->
    <pattern id="hatchLight" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#5a4d40" stroke-width="1" opacity="0.4"/>
    </pattern>
    
    <!-- Hachures moyennes pour les volumes standards -->
    <pattern id="hatchMedium" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#4a3d30" stroke-width="1.2" opacity="0.6"/>
    </pattern>
    
    <!-- Hachures serrées (croisées) pour les ombres -->
    <pattern id="hatchDense" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#3a2a1a" stroke-width="1.5" opacity="0.7"/>
      <line x1="0" y1="0" x2="5" y2="5" stroke="#3a2a1a" stroke-width="1" opacity="0.4"/>
    </pattern>
    
    <!-- Hachures horizontales pour simuler l'ardoise du toit -->
    <pattern id="hatchHorizontal" patternUnits="userSpaceOnUse" width="6" height="6">
      <line x1="0" y1="0" x2="6" y2="0" stroke="#4a3d30" stroke-width="1" opacity="0.5"/>
    </pattern>

    <!-- ======================================================= -->
    <!-- FILTRES DE STYLE CROQUIS -->
    <!-- ======================================================= -->
    
    <!-- Tremblement fort pour les contours principaux -->
    <filter id="sketchyBold" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="3" seed="31" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <!-- Tremblement léger pour les détails et hachures -->
    <filter id="sketchyFine" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.07" numOctaves="2" seed="23" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <!-- Flou très léger pour adoucir les hachures -->
    <filter id="softHatch" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.3"/>
    </filter>
  </defs>

  <!-- ======================================================= -->
  <!-- 1. BASE CYLINDRIQUE EN ENCORBELLEMENT -->
  <!-- ======================================================= -->
  <g id="base-cylindrique">
    
    <!-- Volume principal du cylindre -->
    <path d="M 2100,1290 
             Q 2520,1310 2940,1290 
             L 2940,1650 
             Q 2520,1680 2100,1650 Z" 
          fill="url(#hatchCylinder)" stroke="#2a1a0a" stroke-width="4" 
          filter="url(#sketchyBold)" opacity="0.9"/>

    <!-- Ombre portée sur le cylindre (Côté droit) -->
    <path d="M 2700,1295 
             L 2940,1290 
             L 2940,1650 
             Q 2820,1665 2700,1655 Z" 
          fill="url(#hatchDeepShadow)" opacity="0.6" filter="url(#sketchyFine)"/>

    <!-- Grande arcade centrale (Le passage) -->
    <path d="M 2380,1650 
             L 2380,1480 
             Q 2380,1370 2520,1370 
             Q 2660,1370 2660,1480 
             L 2660,1650 Z" 
          fill="url(#hatchDeepShadow)" stroke="#2a1a0a" stroke-width="4" 
          filter="url(#sketchyBold)" opacity="0.95"/>
    
    <!-- Détail intérieur de l'arcade (profondeur) -->
    <path d="M 2390,1640 
             L 2390,1490 
             Q 2390,1390 2520,1390 
             Q 2650,1390 2650,1490 
             L 2650,1640" 
          fill="none" stroke="#1a0f05" stroke-width="2" 
          filter="url(#sketchyFine)" opacity="0.8"/>

    <!-- Clé de voûte de l'arcade -->
    <path d="M 2510,1375 L 2520,1360 L 2530,1375" 
          fill="none" stroke="#2a1a0a" stroke-width="3" 
          filter="url(#sketchyFine)" opacity="0.8"/>

    <!-- Mâchicoulis / Corbeaux (Sous la corniche) -->
    <g fill="url(#hatchCylinder)" stroke="#2a1a0a" stroke-width="2" filter="url(#sketchyFine)" opacity="0.85">
      <rect x="2130" y="1290" width="20" height="35" rx="2"/>
      <rect x="2170" y="1290" width="20" height="35" rx="2"/>
      <rect x="2210" y="1290" width="20" height="35" rx="2"/>
      <rect x="2250" y="1290" width="20" height="35" rx="2"/>
      <rect x="2290" y="1290" width="20" height="35" rx="2"/>
      <rect x="2330" y="1290" width="20" height="35" rx="2"/>
      <rect x="2670" y="1290" width="20" height="35" rx="2"/>
      <rect x="2710" y="1290" width="20" height="35" rx="2"/>
      <rect x="2750" y="1290" width="20" height="35" rx="2"/>
      <rect x="2790" y="1290" width="20" height="35" rx="2"/>
      <rect x="2830" y="1290" width="20" height="35" rx="2"/>
      <rect x="2870" y="1290" width="20" height="35" rx="2"/>
    </g>

    <!-- Corniche supérieure de la base -->
    <path d="M 2080,1290 Q 2520,1315 2960,1290" 
          fill="none" stroke="#2a1a0a" stroke-width="5" 
          filter="url(#sketchyBold)" opacity="0.9"/>
    <path d="M 2080,1302 Q 2520,1327 2960,1302" 
          fill="none" stroke="#3a2512" stroke-width="2" 
          filter="url(#sketchyFine)" opacity="0.6"/>

    <!-- Petites fenêtres latérales -->
    <g fill="url(#hatchDeepShadow)" stroke="#2a1a0a" stroke-width="2.5" filter="url(#sketchyFine)" opacity="0.9">
      <path d="M 2190,1430 L 2190,1490 Q 2190,1500 2205,1500 L 2215,1500 Q 2230,1500 2230,1490 L 2230,1430 Q 2230,1420 2210,1415 Q 2190,1420 2190,1430 Z"/>
      <path d="M 2810,1430 L 2810,1490 Q 2810,1500 2825,1500 L 2835,1500 Q 2850,1500 2850,1490 L 2850,1430 Q 2850,1420 2830,1415 Q 2810,1420 2810,1430 Z"/>
    </g>

    <!-- Joints de pierre (Appareillage) -->
    <g stroke="#4a3d30" stroke-width="1.5" opacity="0.4" filter="url(#sketchyFine)">
      <path d="M 2120,1360 Q 2520,1380 2920,1360"/>
      <path d="M 2110,1420 Q 2520,1440 2930,1420"/>
      <path d="M 2105,1480 Q 2520,1500 2935,1480"/>
      <path d="M 2100,1540 Q 2520,1560 2940,1540"/>
      <path d="M 2100,1600 Q 2520,1620 2940,1600"/>
    </g>
  </g>

  <!-- ======================================================= -->
  <!-- 2. CORPS CARRÉ CENTRAL (Avec emplacement horloge) -->
  <!-- ======================================================= -->
  <g id="corps-carre">
    <!-- Face principale -->
    <polygon points="2360,700 2360,1290 2680,1290 2680,700" 
             fill="url(#hatchLight)" stroke="#2a1a0a" stroke-width="3" 
             filter="url(#sketchyBold)" opacity="0.85"/>
    
    <!-- Face gauche (perspective, plus sombre) -->
    <polygon points="2320,720 2360,700 2360,1290 2320,1300" 
             fill="url(#hatchDense)" stroke="#2a1a0a" stroke-width="2.5" 
             filter="url(#sketchyBold)" opacity="0.85"/>
    
    <!-- Face droite (perspective, plus sombre) -->
    <polygon points="2680,700 2720,720 2720,1300 2680,1290" 
             fill="url(#hatchDense)" stroke="#2a1a0a" stroke-width="2.5" 
             filter="url(#sketchyBold)" opacity="0.85"/>
    
    <!-- Corniche de transition (Base -> Corps carré) -->
    <polygon points="2300,1280 2740,1280 2740,1300 2300,1300" 
             fill="url(#hatchMedium)" stroke="#2a1a0a" stroke-width="3" 
             filter="url(#sketchyBold)" opacity="0.85"/>
    
    <!-- Corbeaux sous la corniche -->
    <g fill="url(#hatchLight)" stroke="#3a2512" stroke-width="1.5" filter="url(#sketchyFine)" opacity="0.8">
      <rect x="2320" y="1280" width="14" height="22"/>
      <rect x="2360" y="1280" width="14" height="22"/>
      <rect x="2400" y="1280" width="14" height="22"/>
      <rect x="2440" y="1280" width="14" height="22"/>
      <rect x="2480" y="1280" width="14" height="22"/>
      <rect x="2520" y="1280" width="14" height="22"/>
      <rect x="2560" y="1280" width="14" height="22"/>
      <rect x="2600" y="1280" width="14" height="22"/>
      <rect x="2640" y="1280" width="14" height="22"/>
      <rect x="2680" y="1280" width="14" height="22"/>
      <rect x="2710" y="1280" width="14" height="22"/>
    </g>

    <!-- Cadran de l'horloge (Contour esquissé pour guider le calque suivant) -->
    <circle cx="2520" cy="810" r="115" fill="none" stroke="#2a1a0a" stroke-width="2" stroke-dasharray="8,4" filter="url(#sketchyFine)" opacity="0.4"/>
    <circle cx="2520" cy="810" r="105" fill="none" stroke="#3a2512" stroke-width="1" filter="url(#sketchyFine)" opacity="0.3"/>
    
    <!-- Fenêtres gothiques - Niveau inférieur (sous l'horloge) -->
    <g fill="url(#hatchDeepShadow)" stroke="#2a1a0a" stroke-width="2.5" filter="url(#sketchyFine)" opacity="0.9">
      <path d="M 2400,1100 L 2400,1180 Q 2400,1195 2420,1195 L 2440,1195 Q 2460,1195 2460,1180 L 2460,1100 Q 2460,1085 2430,1075 Q 2400,1085 2400,1100 Z"/>
      <path d="M 2580,1100 L 2580,1180 Q 2580,1195 2600,1195 L 2620,1195 Q 2640,1195 2640,1180 L 2640,1100 Q 2640,1085 2610,1075 Q 2580,1085 2580,1100 Z"/>
    </g>
    
    <!-- Fenêtres gothiques - Niveau supérieur (de chaque côté de l'horloge) -->
    <g fill="url(#hatchDense)" stroke="#2a1a0a" stroke-width="2" filter="url(#sketchyFine)" opacity="0.85">
      <path d="M 2390,820 L 2390,880 Q 2390,890 2405,890 L 2415,890 Q 2430,890 2430,880 L 2430,820 Q 2430,810 2410,805 Q 2390,810 2390,820 Z"/>
      <path d="M 2610,820 L 2610,880 Q 2610,890 2625,890 L 2635,890 Q 2650,890 2650,880 L 2650,820 Q 2650,810 2630,805 Q 2610,810 2610,820 Z"/>
    </g>
    
    <!-- Joints de pierre horizontaux -->
    <g stroke="#4a3d30" stroke-width="1.5" opacity="0.35" filter="url(#sketchyFine)">
      <path d="M 2360,800 L 2680,800"/>
      <path d="M 2360,900 L 2680,900"/>
      <path d="M 2360,1000 L 2680,1000"/>
      <path d="M 2360,1100 L 2680,1100"/>
      <path d="M 2360,1200 L 2680,1200"/>
    </g>
    
    <!-- Joints verticaux -->
    <g stroke="#4a3d30" stroke-width="1.5" opacity="0.3" filter="url(#sketchyFine)">
      <path d="M 2450,700 L 2450,1290"/>
      <path d="M 2520,700 L 2520,1290"/>
      <path d="M 2590,700 L 2590,1290"/>
    </g>
  </g>

  <!-- ======================================================= -->
  <!-- 3. TOIT EN POIVRIÈRE (Pyramide à 4 faces) -->
  <!-- ======================================================= -->
  <g id="toit-poivriere">
    <!-- Face avant avec hachures d'ardoise -->
    <polygon points="2340,700 2520,420 2700,700" 
             fill="url(#hatchHorizontal)" stroke="#2a1a0a" stroke-width="3" 
             filter="url(#sketchyBold)" opacity="0.9"/>
    
    <!-- Face gauche (perspective) -->
    <polygon points="2320,710 2340,700 2520,420 2500,430" 
             fill="url(#hatchDense)" stroke="#2a1a0a" stroke-width="2.5" 
             filter="url(#sketchyBold)" opacity="0.9"/>
    
    <!-- Face droite (perspective, très sombre) -->
    <polygon points="2700,700 2720,710 2540,430 2520,420" 
             fill="url(#hatchVeryDense)" stroke="#2a1a0a" stroke-width="2.5" 
             filter="url(#sketchyBold)" opacity="0.9"/>
    
    <!-- Arêtes du toit -->
    <g fill="none" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyBold)" opacity="0.85">
      <path d="M 2340,700 L 2520,420"/>
      <path d="M 2700,700 L 2520,420"/>
      <path d="M 2320,710 L 2500,430"/>
      <path d="M 2720,710 L 2540,430"/>
    </g>
    
    <!-- Lanterne au sommet -->
    <g filter="url(#sketchyFine)">
      <!-- Base de la lanterne -->
      <polygon points="2490,430 2550,430 2550,380 2490,380" 
               fill="url(#hatchMedium)" stroke="#2a1a0a" stroke-width="2.5" opacity="0.85"/>
      <!-- Toit de la lanterne -->
      <polygon points="2485,380 2520,340 2555,380" 
               fill="url(#hatchDense)" stroke="#2a1a0a" stroke-width="2" opacity="0.85"/>
      <!-- Épi / girouette -->
      <line x1="2520" y1="340" x2="2520" y2="310" 
            stroke="#2a1a0a" stroke-width="3" opacity="0.8"/>
      <circle cx="2520" cy="308" r="4" fill="#3a2512" stroke="#2a1a0a" stroke-width="1.5" opacity="0.8"/>
    </g>
    
    <!-- Corniche sous le toit -->
    <polygon points="2330,695 2710,695 2710,710 2330,710" 
             fill="url(#hatchMedium)" stroke="#2a1a0a" stroke-width="3" 
             filter="url(#sketchyBold)" opacity="0.85"/>
  </g>

  <!-- ======================================================= -->
  <!-- 4. TRAITS DE CONSTRUCTION / AMBIANCE -->
  <!-- ======================================================= -->
  <g stroke="#5a4d40" stroke-width="0.8" opacity="0.25" filter="url(#sketchyFine)">
    <!-- Quelques traits de construction légers pour l'ambiance croquis -->
    <line x1="2100" y1="1300" x2="2100" y2="1650"/>
    <line x1="2940" y1="1300" x2="2940" y2="1650"/>
    <line x1="2320" y1="720" x2="2320" y2="1300"/>
    <line x1="2720" y1="720" x2="2720" y2="1300"/>
  </g>
  
  <!-- Hachures diagonales supplémentaires pour le volume de la base -->
  <g stroke="#4a3d30" stroke-width="0.8" opacity="0.2" filter="url(#sketchyFine)">
    <line x1="2150" y1="1350" x2="2200" y2="1600"/>
    <line x1="2250" y1="1350" x2="2300" y2="1600"/>
    <line x1="2750" y1="1350" x2="2800" y2="1600"/>
    <line x1="2850" y1="1350" x2="2900" y2="1600"/>
  </g>

</svg>