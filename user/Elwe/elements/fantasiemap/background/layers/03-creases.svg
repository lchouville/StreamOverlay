<?xml version="1.0" encoding="UTF-8"?>
<!-- Calque : plis de la carte (ombre/trait/reflet par pli, fondus le long de chaque trait). 3840x2160 (16:9). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- plis/craquelures : tremblement + leger flou pour donner du relief -->
    <filter id="creased" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0075 0.02" numOctaves="2" seed="31" result="turbC"/>
      <feDisplacementMap in="SourceGraphic" in2="turbC" scale="28" xChannelSelector="R" yChannelSelector="G" result="dispC"/>
      <feGaussianBlur in="dispC" stdDeviation="1.4"/>
    </filter>

    <!-- ombre portee des plis : meme tremblement, flou beaucoup plus diffus -->
    <filter id="creasedShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0075 0.02" numOctaves="2" seed="31" result="turbCS"/>
      <feDisplacementMap in="SourceGraphic" in2="turbCS" scale="28" xChannelSelector="R" yChannelSelector="G" result="dispCS"/>
      <feGaussianBlur in="dispCS" stdDeviation="9"/>
    </filter>

    <!-- fondus d'intensite le long de chaque pli : le pli s'attenue par endroits au lieu d'etre uniforme -->
    <linearGradient id="creaseFade1" gradientUnits="userSpaceOnUse" x1="1682" y1="0" x2="1576" y2="2160">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="16%" stop-color="#fff"/>
      <stop offset="28%" stop-color="#444"/>
      <stop offset="40%" stop-color="#eee"/>
      <stop offset="58%" stop-color="#aaa"/>
      <stop offset="70%" stop-color="#1a1a1a"/>
      <stop offset="86%" stop-color="#eee"/>
      <stop offset="100%" stop-color="#ccc"/>
    </linearGradient>
    <linearGradient id="creaseFade2" gradientUnits="userSpaceOnUse" x1="0" y1="488" x2="3840" y2="1752">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="14%" stop-color="#fff"/>
      <stop offset="32%" stop-color="#2a2a2a"/>
      <stop offset="46%" stop-color="#fff"/>
      <stop offset="64%" stop-color="#999"/>
      <stop offset="78%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#eee"/>
    </linearGradient>
    <!-- pli incomplet : plus sombre/attenue globalement, et s'eteint en s'approchant de sa fin -->
    <linearGradient id="creaseFade3" gradientUnits="userSpaceOnUse" x1="3004" y1="0" x2="2940" y2="1520">
      <stop offset="0%" stop-color="#999"/>
      <stop offset="18%" stop-color="#222"/>
      <stop offset="34%" stop-color="#888"/>
      <stop offset="52%" stop-color="#101010"/>
      <stop offset="70%" stop-color="#666"/>
      <stop offset="85%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <mask id="creaseMask1" maskUnits="userSpaceOnUse" x="-200" y="-200" width="4240" height="2560">
      <rect x="-200" y="-200" width="4240" height="2560" fill="url(#creaseFade1)"/>
    </mask>
    <mask id="creaseMask2" maskUnits="userSpaceOnUse" x="-200" y="-200" width="4240" height="2560">
      <rect x="-200" y="-200" width="4240" height="2560" fill="url(#creaseFade2)"/>
    </mask>
    <mask id="creaseMask3" maskUnits="userSpaceOnUse" x="-200" y="-200" width="4240" height="2560">
      <rect x="-200" y="-200" width="4240" height="2560" fill="url(#creaseFade3)"/>
    </mask>
  </defs>

  <!-- chaque pli = ombre portee d'un cote + trait + reflet de l'autre cote, -->
  <!-- comme une vraie arete de papier eclairee depuis le haut-gauche. -->
  <!-- les deux premiers plis traversent bord a bord ; le 3e s'arrete en plein milieu -->
  <g stroke="#1a0f05" stroke-width="34" opacity="0.22" filter="url(#creasedShadow)">
    <line x1="1650" y1="0" x2="1544" y2="2160" mask="url(#creaseMask1)"/>
    <line x1="0" y1="520" x2="3840" y2="1784" mask="url(#creaseMask2)"/>
    <line x1="2970" y1="0" x2="2906" y2="1520" mask="url(#creaseMask3)" opacity="0.6"/>
  </g>
  <g stroke="#1a0f05" stroke-width="14" opacity="0.2" filter="url(#creasedShadow)">
    <line x1="1670" y1="0" x2="1564" y2="2160" mask="url(#creaseMask1)"/>
    <line x1="0" y1="500" x2="3840" y2="1764" mask="url(#creaseMask2)"/>
    <line x1="2990" y1="0" x2="2926" y2="1520" mask="url(#creaseMask3)" opacity="0.6"/>
  </g>
  <g stroke="#2a1a0a" stroke-width="6" opacity="0.26" filter="url(#creased)">
    <line x1="1682" y1="0" x2="1576" y2="2160" mask="url(#creaseMask1)"/>
    <line x1="0" y1="488" x2="3840" y2="1752" mask="url(#creaseMask2)"/>
    <line x1="3004" y1="0" x2="2940" y2="1520" mask="url(#creaseMask3)" opacity="0.55"/>
  </g>
  <g stroke="#f3e6c4" stroke-width="5" opacity="0.16" filter="url(#creased)">
    <line x1="1696" y1="0" x2="1590" y2="2160" mask="url(#creaseMask1)"/>
    <line x1="0" y1="474" x2="3840" y2="1738" mask="url(#creaseMask2)"/>
    <line x1="3020" y1="0" x2="2956" y2="1520" mask="url(#creaseMask3)" opacity="0.55"/>
  </g>
  <g stroke="#fff6de" stroke-width="2.5" opacity="0.1" filter="url(#creased)">
    <line x1="1700" y1="0" x2="1594" y2="2160" mask="url(#creaseMask1)"/>
    <line x1="0" y1="470" x2="3840" y2="1734" mask="url(#creaseMask2)"/>
    <line x1="3024" y1="0" x2="2960" y2="1520" mask="url(#creaseMask3)" opacity="0.55"/>
  </g>
</svg>
