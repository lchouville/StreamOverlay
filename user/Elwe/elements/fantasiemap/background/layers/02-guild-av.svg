<?xml version="1.0" encoding="UTF-8"?>
<!-- Calque : Guilde des Aventuriers - Bâtiment principal avec tableau de quêtes. -->
<!-- Style croquis médiéval fantasy, même niveau de détail que les autres bâtiments. -->
<!-- 3840x2160 (16:9). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <pattern id="hatchStone" patternUnits="userSpaceOnUse" width="7" height="7">
      <rect x="0" y="0" width="7" height="7" fill="#b5a481"/>
      <line x1="3.5" y1="0" x2="3.5" y2="7" stroke="#3a2a1a" stroke-width="1.6" opacity="0.8"/>
    </pattern>
    <pattern id="hatchTimber" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect x="0" y="0" width="12" height="12" fill="#d9c9a3"/>
      <line x1="0" y1="0" x2="12" y2="12" stroke="#3a2a1a" stroke-width="1" opacity="0.5"/>
      <line x1="12" y1="0" x2="0" y2="12" stroke="#3a2a1a" stroke-width="1" opacity="0.5"/>
    </pattern>
    <pattern id="hatchRoof" patternUnits="userSpaceOnUse" width="10" height="12">
      <rect x="0" y="0" width="10" height="12" fill="#8c6b45"/>
      <line x1="0" y1="6" x2="10" y2="6" stroke="#2a1a0a" stroke-width="2" opacity="0.8"/>
      <line x1="0" y1="0" x2="10" y2="0" stroke="#2a1a0a" stroke-width="1.2" opacity="0.6"/>
    </pattern>
    <pattern id="hatchWood" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect x="0" y="0" width="8" height="8" fill="#6b4a2e"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#2a1a0a" stroke-width="1.5" opacity="0.7"/>
      <line x1="4" y1="0" x2="4" y2="8" stroke="#2a1a0a" stroke-width="1" opacity="0.5"/>
    </pattern>
    <filter id="sketchyHeavy" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.04" numOctaves="4" seed="42" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sketchyMedium" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.07" numOctaves="3" seed="58" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g id="guilde-aventuriers" transform="translate(3170, 844)">
    
    <!-- ======================================================= -->
    <!-- ÉTAPE 1 : STRUCTURES DE BASE -->
    <!-- ======================================================= -->
    
    <!-- RDC (Pierre - plus imposant car bâtiment officiel) -->
    <rect x="0" y="250" width="380" height="220" 
          fill="#d4ba82" stroke="#1a0f05" stroke-width="6" 
          filter="url(#sketchyHeavy)" opacity="0.95"/>
    <rect x="0" y="250" width="380" height="220" 
          fill="url(#hatchStone)" opacity="0.6"/>
    
    <!-- Étage 1 (Colombages avec encorbellement) -->
    <rect x="-20" y="120" width="420" height="130" 
          fill="#d4ba82" stroke="#1a0f05" stroke-width="5" 
          filter="url(#sketchyHeavy)" opacity="0.95"/>
    <rect x="-20" y="120" width="420" height="130" 
          fill="url(#hatchTimber)" opacity="0.7"/>
    
    <!-- Étage 2 (Colombages, encorbellement plus marqué) -->
    <rect x="-40" y="0" width="460" height="120" 
          fill="#d4ba82" stroke="#1a0f05" stroke-width="5" 
          filter="url(#sketchyHeavy)" opacity="0.95"/>
    <rect x="-40" y="0" width="460" height="120" 
          fill="url(#hatchTimber)" opacity="0.7"/>
    
    <!-- Toit à deux pentes avec lucarne centrale -->
    <polygon points="-60,0 190,-220 440,0" 
             fill="url(#hatchRoof)" stroke="#1a0f05" stroke-width="6" 
             filter="url(#sketchyHeavy)" opacity="0.95"/>

    <!-- Poutres de soutien des encorbellements -->
    <g fill="#2a1a0a" filter="url(#sketchyMedium)">
      <path d="M 0,250 L -20,250 L -20,220 L 15,220 L 15,250"/>
      <path d="M 380,250 L 400,250 L 400,220 L 365,220 L 365,250"/>
      <path d="M -20,120 L -40,120 L -40,90 L 5,90 L 5,120"/>
      <path d="M 400,120 L 420,120 L 420,90 L 375,90 L 375,120"/>
    </g>

    <!-- ======================================================= -->
    <!-- ÉTAPE 2 : DÉTAILS DES MURS -->
    <!-- ======================================================= -->
    
    <!-- Poutres colombages Étage 1 -->
    <g fill="none" stroke="#1a0f05" stroke-width="4" filter="url(#sketchyMedium)" opacity="0.9">
      <rect x="-20" y="120" width="420" height="130"/>
      <line x1="-20" y1="120" x2="100" y2="250"/>
      <line x1="100" y1="120" x2="-20" y2="250"/>
      <line x1="280" y1="120" x2="400" y2="250"/>
      <line x1="400" y1="120" x2="280" y2="250"/>
      <line x1="190" y1="120" x2="190" y2="250"/>
      <line x1="-20" y1="185" x2="400" y2="185"/>
    </g>

    <!-- Poutres colombages Étage 2 -->
    <g fill="none" stroke="#1a0f05" stroke-width="4" filter="url(#sketchyMedium)" opacity="0.9">
      <rect x="-40" y="0" width="460" height="120"/>
      <line x1="-40" y1="0" x2="80" y2="120"/>
      <line x1="80" y1="0" x2="-40" y2="120"/>
      <line x1="300" y1="0" x2="420" y2="120"/>
      <line x1="420" y1="0" x2="300" y2="120"/>
      <line x1="190" y1="0" x2="190" y2="120"/>
      <line x1="-40" y1="60" x2="420" y2="60"/>
    </g>

    <!-- Joints de pierre RDC -->
    <g stroke="#2a1a0a" stroke-width="2" opacity="0.6" filter="url(#sketchyMedium)">
      <line x1="0" y1="320" x2="380" y2="320"/>
      <line x1="0" y1="390" x2="380" y2="390"/>
      <line x1="190" y1="250" x2="190" y2="320"/>
      <line x1="95" y1="320" x2="95" y2="390"/>
      <line x1="285" y1="320" x2="285" y2="390"/>
    </g>

    <!-- Lignes de toit -->
    <g stroke="#2a1a0a" stroke-width="1.5" opacity="0.6" filter="url(#sketchyMedium)">
      <line x1="-20" y1="-40" x2="400" y2="-40"/>
      <line x1="20" y1="-90" x2="360" y2="-90"/>
      <line x1="60" y1="-140" x2="320" y2="-140"/>
      <line x1="100" y1="-180" x2="280" y2="-180"/>
    </g>

    <!-- ======================================================= -->
    <!-- ÉTAPE 3 : OUVERTURES -->
    <!-- ======================================================= -->
    
    <!-- GRANDE PORTE D'ENTRÉE (large, pour les groupes) -->
    <path d="M 130,470 L 130,340 Q 130,310 190,310 Q 250,310 250,340 L 250,470 Z" 
          fill="url(#hatchWood)" stroke="#1a0f05" stroke-width="5" 
          filter="url(#sketchyHeavy)" opacity="0.95"/>
    <!-- Ferrures -->
    <g stroke="#1a0f05" stroke-width="3" filter="url(#sketchyMedium)">
      <line x1="150" y1="340" x2="230" y2="340"/>
      <line x1="150" y1="400" x2="230" y2="400"/>
      <line x1="150" y1="450" x2="230" y2="450"/>
      <line x1="190" y1="310" x2="190" y2="470"/>
    </g>
    <!-- Anneaux -->
    <circle cx="170" cy="390" r="7" fill="none" stroke="#1a0f05" stroke-width="3" filter="url(#sketchyMedium)"/>
    <circle cx="210" cy="390" r="7" fill="none" stroke="#1a0f05" stroke-width="3" filter="url(#sketchyMedium)"/>

    <!-- Fenêtres Étage 1 (grandes, salle des quêtes) -->
    <g filter="url(#sketchyMedium)">
      <rect x="30" y="150" width="80" height="90" fill="#1a0f05" opacity="0.9"/>
      <rect x="270" y="150" width="80" height="90" fill="#1a0f05" opacity="0.9"/>
      <!-- Croisillons -->
      <line x1="70" y1="150" x2="70" y2="240" stroke="#d4ba82" stroke-width="2"/>
      <line x1="30" y1="195" x2="110" y2="195" stroke="#d4ba82" stroke-width="2"/>
      <line x1="310" y1="150" x2="310" y2="240" stroke="#d4ba82" stroke-width="2"/>
      <line x1="270" y1="195" x2="350" y2="195" stroke="#d4ba82" stroke-width="2"/>
    </g>

    <!-- Fenêtres Étage 2 -->
    <g filter="url(#sketchyMedium)">
      <rect x="20" y="25" width="70" height="75" fill="#1a0f05" opacity="0.9"/>
      <rect x="155" y="25" width="70" height="75" fill="#1a0f05" opacity="0.9"/>
      <rect x="290" y="25" width="70" height="75" fill="#1a0f05" opacity="0.9"/>
      <!-- Croisillons -->
      <line x1="55" y1="25" x2="55" y2="100" stroke="#d4ba82" stroke-width="2"/>
      <line x1="20" y1="62" x2="90" y2="62" stroke="#d4ba82" stroke-width="2"/>
      <line x1="190" y1="25" x2="190" y2="100" stroke="#d4ba82" stroke-width="2"/>
      <line x1="155" y1="62" x2="225" y2="62" stroke="#d4ba82" stroke-width="2"/>
      <line x1="325" y1="25" x2="325" y2="100" stroke="#d4ba82" stroke-width="2"/>
      <line x1="290" y1="62" x2="360" y2="62" stroke="#d4ba82" stroke-width="2"/>
    </g>

    <!-- Lucarne centrale dans le toit -->
    <g filter="url(#sketchyMedium)">
      <polygon points="150,-60 190,-110 230,-60" fill="url(#hatchRoof)" stroke="#1a0f05" stroke-width="3"/>
      <rect x="160" y="-60" width="60" height="55" fill="#1a0f05" stroke="#1a0f05" stroke-width="3"/>
      <line x1="190" y1="-60" x2="190" y2="-5" stroke="#d4ba82" stroke-width="2"/>
      <line x1="160" y1="-32" x2="220" y2="-32" stroke="#d4ba82" stroke-width="2"/>
    </g>

    <!-- ======================================================= -->
    <!-- ÉTAPE 4 : ÉLÉMENTS DE GUILDE (Le plus important !) -->
    <!-- ======================================================= -->
    
    <!-- MARCHES D'ENTRÉE (3 marches en pierre) -->
    <g filter="url(#sketchyMedium)">
      <rect x="110" y="470" width="160" height="15" fill="url(#hatchStone)" stroke="#1a0f05" stroke-width="3"/>
      <rect x="100" y="485" width="180" height="15" fill="url(#hatchStone)" stroke="#1a0f05" stroke-width="3"/>
      <rect x="90" y="500" width="200" height="15" fill="url(#hatchStone)" stroke="#1a0f05" stroke-width="3"/>
    </g>

    <!-- TORCHES MURALES de chaque côté de la porte -->
    <g filter="url(#sketchyMedium)">
      <!-- Torche gauche -->
      <rect x="95" y="330" width="10" height="40" fill="#5a4030" stroke="#1a0f05" stroke-width="2"/>
      <path d="M 92,330 Q 100,315 108,330 Q 100,340 92,330" fill="#8b4513" opacity="0.8"/>
      <path d="M 95,325 Q 100,310 105,325" fill="none" stroke="#8b4513" stroke-width="1.5" opacity="0.6"/>
      <!-- Torche droite -->
      <rect x="275" y="330" width="10" height="40" fill="#5a4030" stroke="#1a0f05" stroke-width="2"/>
      <path d="M 272,330 Q 280,315 288,330 Q 280,340 272,330" fill="#8b4513" opacity="0.8"/>
      <path d="M 275,325 Q 280,310 285,325" fill="none" stroke="#8b4513" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- ARMES ACCROCHÉES AU MUR (à gauche de la porte) -->
    <g filter="url(#sketchyMedium)">
      <!-- Épée verticale -->
      <line x1="50" y1="280" x2="50" y2="380" stroke="#1a0f05" stroke-width="3"/>
      <line x1="40" y1="330" x2="60" y2="330" stroke="#1a0f05" stroke-width="4"/>
      <circle cx="50" cy="340" r="4" fill="#1a0f05"/>
      <!-- Bouclier -->
      <path d="M 70,300 L 70,350 Q 70,370 90,370 Q 110,370 110,350 L 110,300 Q 90,290 70,300 Z" 
            fill="#8b7355" stroke="#1a0f05" stroke-width="3"/>
      <line x1="90" y1="300" x2="90" y2="370" stroke="#1a0f05" stroke-width="2"/>
      <line x1="70" y1="335" x2="110" y2="335" stroke="#1a0f05" stroke-width="2"/>
    </g>

    <!-- TABLEAU D'AFFICHAGE DES QUÊTES (élément signature !) -->
    <g id="tableau-quetes" filter="url(#sketchyMedium)">
      <!-- Support en bois -->
      <rect x="290" y="280" width="120" height="150" fill="url(#hatchWood)" stroke="#1a0f05" stroke-width="4"/>
      <!-- Pieds du tableau -->
      <line x1="300" y1="430" x2="300" y2="470" stroke="#1a0f05" stroke-width="4"/>
      <line x1="400" y1="430" x2="400" y2="470" stroke="#1a0f05" stroke-width="4"/>
      
      <!-- Parchemins cloués (3 quêtes) -->
      <!-- Quête 1 (en haut) -->
      <rect x="300" y="290" width="100" height="35" fill="#e9d7ab" stroke="#1a0f05" stroke-width="2"/>
      <circle cx="350" cy="295" r="2" fill="#1a0f05"/> <!-- clou -->
      <line x1="310" y1="305" x2="390" y2="305" stroke="#3a2a1a" stroke-width="1.5" opacity="0.7"/>
      <line x1="310" y1="312" x2="380" y2="312" stroke="#3a2a1a" stroke-width="1.5" opacity="0.7"/>
      <line x1="310" y1="319" x2="370" y2="319" stroke="#3a2a1a" stroke-width="1.5" opacity="0.7"/>
      
      <!-- Quête 2 (milieu, légèrement tournée) -->
      <g transform="rotate(-3, 350, 350)">
        <rect x="300" y="332" width="100" height="35" fill="#e9d7ab" stroke="#1a0f05" stroke-width="2"/>
        <circle cx="350" cy="337" r="2" fill="#1a0f05"/>
        <line x1="310" y1="347" x2="390" y2="347" stroke="#3a2a1a" stroke-width="1.5" opacity="0.7"/>
        <line x1="310" y1="354" x2="385" y2="354" stroke="#3a2a1a" stroke-width="1.5" opacity="0.7"/>
        <line x1="310" y1="361" x2="375" y2="361" stroke="#3a2a1a" stroke-width="1.5" opacity="0.7"/>
      </g>
      
      <!-- Quête 3 (en bas, un coin déchiré) -->
      <path d="M 300,375 L 400,375 L 400,415 L 380,420 L 370,410 L 300,410 Z" 
            fill="#e9d7ab" stroke="#1a0f05" stroke-width="2"/>
      <circle cx="350" cy="380" r="2" fill="#1a0f05"/>
      <line x1="310" y1="390" x2="390" y2="390" stroke="#3a2a1a" stroke-width="1.5" opacity="0.7"/>
      <line x1="310" y1="397" x2="380" y2="397" stroke="#3a2a1a" stroke-width="1.5" opacity="0.7"/>
      <line x1="310" y1="404" x2="360" y2="404" stroke="#3a2a1a" stroke-width="1.5" opacity="0.7"/>
    </g>

    <!-- BANNIÈRE PENDANTE (au-dessus de la porte) -->
    <g filter="url(#sketchyMedium)">
      <!-- Support horizontal -->
      <line x1="100" y1="290" x2="280" y2="290" stroke="#1a0f05" stroke-width="4"/>
      <!-- Bannière en tissu -->
      <path d="M 150,290 L 230,290 L 230,340 L 190,360 L 150,340 Z" 
            fill="#8b4513" stroke="#1a0f05" stroke-width="3" opacity="0.9"/>
      <!-- Symbole sur la bannière (rose des vents simplifiée) -->
      <circle cx="190" cy="320" r="12" fill="none" stroke="#d4ba82" stroke-width="2"/>
      <line x1="190" y1="308" x2="190" y2="332" stroke="#d4ba82" stroke-width="2"/>
      <line x1="178" y1="320" x2="202" y2="320" stroke="#d4ba82" stroke-width="2"/>
      <line x1="182" y1="312" x2="198" y2="328" stroke="#d4ba82" stroke-width="1.5"/>
      <line x1="198" y1="312" x2="182" y2="328" stroke="#d4ba82" stroke-width="1.5"/>
    </g>

    <!-- GRANDE ENSEIGNE SUSPENDUE (côté droit, écu avec épées croisées) -->
    <g id="enseigne-guilde" filter="url(#sketchyMedium)">
      <!-- Support en fer forgé -->
      <path d="M 400,180 L 400,140 L 480,140" fill="none" stroke="#1a0f05" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 400,165 Q 425,165 425,140" fill="none" stroke="#1a0f05" stroke-width="3" stroke-linecap="round"/>
      <line x1="480" y1="140" x2="485" y2="135" stroke="#1a0f05" stroke-width="3" stroke-linecap="round"/>

      <!-- Chaînes -->
      <line x1="435" y1="140" x2="440" y2="115" stroke="#1a0f05" stroke-width="2.5" stroke-dasharray="4,2"/>
      <line x1="475" y1="140" x2="470" y2="115" stroke="#1a0f05" stroke-width="2.5" stroke-dasharray="4,2"/>
      <circle cx="440" cy="115" r="3" fill="none" stroke="#1a0f05" stroke-width="2"/>
      <circle cx="470" cy="115" r="3" fill="none" stroke="#1a0f05" stroke-width="2"/>

      <!-- Écu (forme de bouclier) -->
      <path d="M 420,115 L 490,115 L 490,165 L 455,195 L 420,165 Z" 
            fill="#d4ba82" stroke="#1a0f05" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 426,121 L 484,121 L 484,163 L 455,188 L 426,163 Z" 
            fill="none" stroke="#3a2a1a" stroke-width="2" stroke-linejoin="round"/>

      <!-- Symbole : Épées croisées -->
      <g stroke="#1a0f05" stroke-width="3" stroke-linecap="round">
        <line x1="435" y1="130" x2="475" y2="175"/>
        <line x1="475" y1="130" x2="435" y2="175"/>
        <!-- Gardes des épées -->
        <line x1="445" y1="140" x2="455" y2="135" stroke-width="3"/>
        <line x1="465" y1="140" x2="455" y2="135" stroke-width="3"/>
        <line x1="445" y1="165" x2="455" y2="170" stroke-width="3"/>
        <line x1="465" y1="165" x2="455" y2="170" stroke-width="3"/>
      </g>

      <!-- Petite lanterne sous l'écu -->
      <line x1="455" y1="195" x2="455" y2="210" stroke="#1a0f05" stroke-width="2"/>
      <polygon points="448,210 462,210 464,228 446,228" fill="#d4ba82" stroke="#1a0f05" stroke-width="2" opacity="0.8"/>
      <polygon points="446,210 455,203 464,210" fill="#2a1a0a" stroke="#1a0f05" stroke-width="1.5"/>
      <path d="M 452,218 Q 455,214 458,218 Q 455,222 452,218" fill="#8b4513" opacity="0.7"/>
    </g>

  </g>
</svg>