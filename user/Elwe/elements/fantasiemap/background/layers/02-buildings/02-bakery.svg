<?xml version="1.0" encoding="UTF-8"?>
<!-- Calque : Échoppe d'apothicaire avec petite enseigne suspendue à droite. -->
<!-- 3840x2160 (16:9). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <pattern id="hatchStone" patternUnits="userSpaceOnUse" width="7" height="7">
      <rect x="0" y="0" width="7" height="7" fill="#b5a481"/>
      <line x1="3.5" y1="0" x2="3.5" y2="7" stroke="#3a2a1a" stroke-width="1.6" opacity="0.8"/>
    </pattern>
    <pattern id="hatchWood" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect x="0" y="0" width="8" height="8" fill="#6b4a2e"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#2a1a0a" stroke-width="1.5" opacity="0.7"/>
      <line x1="4" y1="0" x2="4" y2="8" stroke="#2a1a0a" stroke-width="1" opacity="0.5"/>
    </pattern>
    <pattern id="hatchRoof" patternUnits="userSpaceOnUse" width="10" height="12">
      <rect x="0" y="0" width="10" height="12" fill="#8c6b45"/>
      <line x1="0" y1="6" x2="10" y2="6" stroke="#2a1a0a" stroke-width="2" opacity="0.8"/>
      <line x1="0" y1="0" x2="10" y2="0" stroke="#2a1a0a" stroke-width="1.2" opacity="0.6"/>
    </pattern>
    <pattern id="hatchAwning" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect x="0" y="0" width="20" height="40" fill="#8b4513"/>
      <rect x="20" y="0" width="20" height="40" fill="#d4ba82"/>
    </pattern>
    <pattern id="hatchBarrel" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect x="0" y="0" width="6" height="6" fill="#6b4a2e"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#2a1a0a" stroke-width="1" opacity="0.7"/>
    </pattern>
    <pattern id="hatchBrick" patternUnits="userSpaceOnUse" width="7" height="7">
      <rect x="0" y="0" width="7" height="7" fill="#9a5f3c"/>
      <line x1="3.5" y1="0" x2="3.5" y2="7" stroke="#3a1a0a" stroke-width="1.6" opacity="0.8"/>
    </pattern>
    <filter id="sketchyHeavy" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.04" numOctaves="4" seed="42" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sketchyMedium" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.07" numOctaves="3" seed="58" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Plus grande / au premier plan (profondeur) : collee contre la tour, chevauchant son mur -->
  <!-- gauche de ~100u (l'auberge se dessine apres la tour, donc son enseigne et ses details -->
  <!-- restent entierement visibles par-dessus). Sol abaisse de 70u (vs tour) pour renforcer -->
  <!-- l'effet premier plan plutot que meme niveau que la tour. -->
  <g id="echoppe-apothicaire" transform="translate(1892,79.25) scale(0.6)">

    <!-- STRUCTURE DE BASE -->
    <rect x="850" y="1450" width="500" height="300" 
          fill="url(#hatchStone)" stroke="#1a0f05" stroke-width="6" 
          filter="url(#sketchyHeavy)"/>
    <!-- Toit vu de face, perpendiculaire a la pente (pignons sur les cotes) : on voit le pan -->
    <!-- de tuiles entier, faitage horizontal presque aussi large que l'egout, rangs de tuiles -->
    <!-- paralleles au faitage. Petites croupes en biais aux extremites. -->
    <polygon points="830,1450 870,1310 1330,1310 1370,1450" 
             fill="url(#hatchRoof)" stroke="#1a0f05" stroke-width="6" 
             filter="url(#sketchyHeavy)"/>
    <!-- Zone plate au sommet (terrasse vue legerement de dessus) -->
    <rect x="864" y="1298" width="472" height="12" fill="#b5a481" stroke="#1a0f05" stroke-width="4" filter="url(#sketchyMedium)"/>

    <!-- DÉTAILS DU BÂTIMENT -->
    <g stroke="#2a1a0a" stroke-width="2" filter="url(#sketchyMedium)">
      <line x1="850" y1="1520" x2="1350" y2="1520"/>
      <line x1="850" y1="1590" x2="1350" y2="1590"/>
      <line x1="850" y1="1660" x2="1350" y2="1660"/>
      <line x1="1000" y1="1450" x2="1000" y2="1520"/>
      <line x1="1150" y1="1520" x2="1150" y2="1590"/>
      <line x1="950" y1="1590" x2="950" y2="1660"/>
      <line x1="1250" y1="1660" x2="1250" y2="1750"/>
    </g>
    <g stroke="#2a1a0a" stroke-width="1.5" filter="url(#sketchyMedium)">
      <!-- Rangs de tuiles (bords suivant les aretiers : x = 830 + (1450-y)*40/140) -->
      <line x1="864" y1="1340" x2="1336" y2="1340"/>
      <line x1="856" y1="1370" x2="1344" y2="1370"/>
      <line x1="847" y1="1400" x2="1353" y2="1400"/>
      <line x1="839" y1="1430" x2="1361" y2="1430"/>
    </g>

    <!-- CHEMINÉE en brique (four à pain) qui sort du pan de toit (base a y=1360). Fumee animee placee en inline dans -->
    <!-- ville-medievale-croquis.svg (#boulangerie-smoke), au sommet (1235,1168) de ce calque -->
    <!-- passe par sa transform -> (2633,780). -->
    <path d="M 1210,1360 L 1210,1180 L 1260,1180 L 1260,1360 Z"
          fill="url(#hatchBrick)" stroke="#1a0f05" stroke-width="4"
          filter="url(#sketchyMedium)"/>
    <g stroke="#2a1a0a" stroke-width="1.5" filter="url(#sketchyMedium)">
      <line x1="1210" y1="1215" x2="1260" y2="1215"/>
      <line x1="1210" y1="1250" x2="1260" y2="1250"/>
      <line x1="1210" y1="1285" x2="1260" y2="1285"/>
      <line x1="1235" y1="1180" x2="1235" y2="1215"/>
      <line x1="1222" y1="1215" x2="1222" y2="1250"/>
      <line x1="1248" y1="1215" x2="1248" y2="1250"/>
      <line x1="1235" y1="1250" x2="1235" y2="1285"/>
      <line x1="1210" y1="1320" x2="1260" y2="1320"/>
      <line x1="1222" y1="1285" x2="1222" y2="1320"/>
      <line x1="1248" y1="1285" x2="1248" y2="1320"/>
      <line x1="1235" y1="1320" x2="1235" y2="1358"/>
    </g>
    <rect x="1203" y="1168" width="64" height="14"
          fill="#2a1a0a" stroke="#1a0f05" stroke-width="2" filter="url(#sketchyMedium)"/>

    <!-- OUVERTURES -->
    <path d="M 1200,1750 L 1200,1600 Q 1200,1570 1250,1570 Q 1300,1570 1300,1600 L 1300,1750 Z" 
          fill="url(#hatchWood)" stroke="#1a0f05" stroke-width="5" 
          filter="url(#sketchyHeavy)"/>
    <circle cx="1220" cy="1660" r="6" fill="none" stroke="#1a0f05" stroke-width="2.5" filter="url(#sketchyMedium)"/>
    <circle cx="1220" cy="1660" r="3" fill="#1a0f05"/>

    <rect x="920" y="1550" width="180" height="120" 
          fill="#1a0f05" stroke="#1a0f05" stroke-width="4" 
          filter="url(#sketchyMedium)"/>
    <path d="M 920,1550 L 880,1560 L 880,1670 L 920,1670 Z" 
          fill="url(#hatchWood)" stroke="#1a0f05" stroke-width="3" filter="url(#sketchyMedium)"/>
    <path d="M 1100,1550 L 1140,1560 L 1140,1670 L 1100,1670 Z" 
          fill="url(#hatchWood)" stroke="#1a0f05" stroke-width="3" filter="url(#sketchyMedium)"/>
    <line x1="910" y1="1670" x2="1110" y2="1670" stroke="#1a0f05" stroke-width="5" filter="url(#sketchyMedium)"/>
    
    <g filter="url(#sketchyMedium)">
      <rect x="940" y="1620" width="20" height="30" fill="#d4ba82" stroke="#1a0f05" stroke-width="2"/>
      <rect x="970" y="1610" width="25" height="40" fill="#d4ba82" stroke="#1a0f05" stroke-width="2"/>
      <rect x="1005" y="1625" width="18" height="25" fill="#d4ba82" stroke="#1a0f05" stroke-width="2"/>
      <rect x="1035" y="1615" width="22" height="35" fill="#d4ba82" stroke="#1a0f05" stroke-width="2"/>
      <rect x="1065" y="1620" width="20" height="30" fill="#d4ba82" stroke="#1a0f05" stroke-width="2"/>
    </g>

    <!-- AUVENT ET ÉTALAGE -->
    <line x1="900" y1="1500" x2="900" y2="1750" stroke="#1a0f05" stroke-width="5" filter="url(#sketchyMedium)"/>
    <line x1="1150" y1="1500" x2="1150" y2="1750" stroke="#1a0f05" stroke-width="5" filter="url(#sketchyMedium)"/>
    <path d="M 850,1500 L 900,1450 L 1150,1450 L 1200,1500 Z" 
          fill="url(#hatchAwning)" stroke="#1a0f05" stroke-width="4" 
          filter="url(#sketchyMedium)"/>
    <g stroke="#1a0f05" stroke-width="2" filter="url(#sketchyMedium)">
      <line x1="860" y1="1500" x2="860" y2="1520"/>
      <line x1="900" y1="1500" x2="900" y2="1520"/>
      <line x1="940" y1="1500" x2="940" y2="1520"/>
      <line x1="980" y1="1500" x2="980" y2="1520"/>
      <line x1="1020" y1="1500" x2="1020" y2="1520"/>
      <line x1="1060" y1="1500" x2="1060" y2="1520"/>
      <line x1="1100" y1="1500" x2="1100" y2="1520"/>
      <line x1="1140" y1="1500" x2="1140" y2="1520"/>
      <line x1="1180" y1="1500" x2="1180" y2="1520"/>
    </g>
    <g stroke="#3a2a1a" stroke-width="2" filter="url(#sketchyMedium)">
      <line x1="920" y1="1500" x2="920" y2="1540"/>
      <line x1="980" y1="1500" x2="980" y2="1545"/>
      <line x1="1040" y1="1500" x2="1040" y2="1540"/>
      <line x1="1100" y1="1500" x2="1100" y2="1545"/>
    </g>
    <rect x="920" y="1680" width="200" height="15" 
          fill="url(#hatchWood)" stroke="#1a0f05" stroke-width="3" 
          filter="url(#sketchyMedium)"/>
    <line x1="940" y1="1695" x2="940" y2="1750" stroke="#1a0f05" stroke-width="4" filter="url(#sketchyMedium)"/>
    <line x1="1100" y1="1695" x2="1100" y2="1750" stroke="#1a0f05" stroke-width="4" filter="url(#sketchyMedium)"/>
    <g filter="url(#sketchyMedium)">
      <path d="M 950,1680 Q 950,1650 970,1650 Q 990,1650 990,1680 Z" fill="#8b7355" stroke="#1a0f05" stroke-width="2.5"/>
      <path d="M 1000,1680 Q 1000,1655 1015,1655 Q 1030,1655 1030,1680 Z" fill="#8b7355" stroke="#1a0f05" stroke-width="2.5"/>
      <path d="M 1040,1680 Q 1040,1660 1055,1660 Q 1070,1660 1070,1680 Z" fill="#8b7355" stroke="#1a0f05" stroke-width="2.5"/>
    </g>
    <!-- Tonneaux : contre le mur exterieur droit (x=1350), pour degager la porte (qui s'ouvre -->
    <!-- vers la rue, cf. #porte-auberge). Le gauche est remonte (en retrait), le droit passe -->
    <!-- devant en le chevauchant un peu. Le chat assis dessus est anime en inline dans -->
    <!-- ville-medievale-croquis.svg (#chat-boulangerie). -->
    <g filter="url(#sketchyMedium)" transform="translate(215,-18)">
      <ellipse cx="1180" cy="1720" rx="25" ry="30" fill="url(#hatchBarrel)" stroke="#1a0f05" stroke-width="3"/>
      <line x1="1155" y1="1700" x2="1205" y2="1700" stroke="#1a0f05" stroke-width="2"/>
      <line x1="1155" y1="1740" x2="1205" y2="1740" stroke="#1a0f05" stroke-width="2"/>
    </g>
    <g filter="url(#sketchyMedium)" transform="translate(200,0)">
      <ellipse cx="1230" cy="1730" rx="20" ry="25" fill="url(#hatchBarrel)" stroke="#1a0f05" stroke-width="3"/>
      <line x1="1210" y1="1715" x2="1250" y2="1715" stroke="#1a0f05" stroke-width="2"/>
      <line x1="1210" y1="1745" x2="1250" y2="1745" stroke="#1a0f05" stroke-width="2"/>
    </g>

    <!-- PETITE ENSEIGNE SUSPENDUE À DROITE -->
    <g id="petite-enseigne-droite" filter="url(#sketchyMedium)">
      
      <!-- Support en fer forgé (fixé au mur droit) -->
      <path d="M 1350,1480 L 1350,1420 L 1420,1420" fill="none" stroke="#1a0f05" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Petite console décorative -->
      <path d="M 1350,1450 Q 1370,1450 1370,1420" fill="none" stroke="#1a0f05" stroke-width="3" stroke-linecap="round"/>
      <!-- Pointe décorative -->
      <line x1="1420" y1="1420" x2="1425" y2="1415" stroke="#1a0f05" stroke-width="3" stroke-linecap="round"/>

      <!-- Chaînes de suspension -->
      <line x1="1385" y1="1420" x2="1390" y2="1390" stroke="#1a0f05" stroke-width="2.5" stroke-dasharray="4,2"/>
      <line x1="1415" y1="1420" x2="1410" y2="1390" stroke="#1a0f05" stroke-width="2.5" stroke-dasharray="4,2"/>
      <!-- Anneaux -->
      <circle cx="1390" cy="1390" r="3" fill="none" stroke="#1a0f05" stroke-width="2"/>
      <circle cx="1410" cy="1390" r="3" fill="none" stroke="#1a0f05" stroke-width="2"/>

      <!-- Planche (forme de bouclier, plus petite) -->
      <path d="M 1370,1390 L 1430,1390 L 1430,1435 L 1400,1460 L 1370,1435 Z" 
            fill="#d4ba82" stroke="#1a0f05" stroke-width="4" stroke-linejoin="round"/>
      
      <!-- Bordure intérieure -->
      <path d="M 1375,1395 L 1425,1395 L 1425,1433 L 1400,1453 L 1375,1433 Z" 
            fill="none" stroke="#3a2a1a" stroke-width="2" stroke-linejoin="round"/>

      <!-- Veines du bois -->
      <g stroke="#3a2a1a" stroke-width="1" fill="none">
        <path d="M 1380,1400 Q 1390,1410 1380,1425"/>
        <path d="M 1415,1400 Q 1410,1415 1415,1430"/>
      </g>

      <!-- Symbole : fourchette à 3 dents et couteau, resserrés au centre et raccourcis pour -->
      <!-- tenir dans la bordure intérieure (pointe basse de la bordure à y~1445 vers x=1390-1410) -->
      <g stroke="#1a0f05" stroke-linecap="round" stroke-linejoin="round">
        <!-- Fourchette -->
        <g fill="none" stroke-width="1.8">
          <line x1="1390" y1="1401" x2="1390" y2="1410"/>
          <line x1="1394" y1="1401" x2="1394" y2="1410"/>
          <line x1="1398" y1="1401" x2="1398" y2="1410"/>
          <path d="M 1389,1409 Q 1394,1415 1399,1409"/>
        </g>
        <line x1="1394" y1="1413" x2="1394" y2="1438" stroke-width="2.8"/>
        <!-- Couteau : lame a dos droit, tranchant arrondi -->
        <path d="M 1405,1401 Q 1412,1406 1411,1423 L 1405,1423 Z" fill="#b9b1a0" stroke-width="1.6"/>
        <line x1="1407" y1="1424" x2="1407" y2="1438" stroke-width="3.2"/>
      </g>

      <!-- Petite lanterne sous l'enseigne -->
      <line x1="1400" y1="1460" x2="1400" y2="1475" stroke="#1a0f05" stroke-width="2"/>
      <polygon points="1393,1475 1407,1475 1410,1495 1390,1495" fill="#d4ba82" stroke="#1a0f05" stroke-width="2"/>
      <polygon points="1390,1475 1400,1468 1410,1475" fill="#2a1a0a" stroke="#1a0f05" stroke-width="1.5"/>
      <path d="M 1397,1485 Q 1400,1480 1403,1485 Q 1400,1490 1397,1485" fill="#8b4513"/>

    </g>

  </g>
</svg>
