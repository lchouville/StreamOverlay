<?xml version="1.0" encoding="UTF-8"?>
<!-- Calque : Puits médiéval en pierre avec toit en bois. -->
<!-- Style croquis avec hachures pierre/bois. -->
<!-- Pierre grise (plus froide que les paves ocre) pour se detacher du sol. -->
<!-- Place en bas a droite de la place, a 75% : pied (y=225) en (3600,1550), hauteur coherente -->
<!-- avec la distance (margelle ~1.2 m). Couleurs accordees au papier (pierre chaude, mousse brune). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Texture pierre -->
    <pattern id="stoneTexture" patternUnits="userSpaceOnUse" width="40" height="30">
      <rect width="40" height="30" fill="#9c968a"/>
      <rect x="2" y="2" width="36" height="12" fill="#b2ab9c" stroke="#3a2a1a" stroke-width="1" opacity="0.6"/>
      <rect x="2" y="16" width="17" height="12" fill="#857e70" stroke="#3a2a1a" stroke-width="1" opacity="0.6"/>
      <rect x="21" y="16" width="17" height="12" fill="#b2ab9c" stroke="#3a2a1a" stroke-width="1" opacity="0.6"/>
    </pattern>

    <!-- Hachures bois -->
    <pattern id="hatchWood" patternUnits="userSpaceOnUse" width="8" height="8">
      <line x1="0" y1="4" x2="8" y2="4" stroke="#2a1a0a" stroke-width="1.5" opacity="0.7"/>
      <line x1="4" y1="0" x2="4" y2="8" stroke="#2a1a0a" stroke-width="1" opacity="0.5"/>
    </pattern>

    <!-- Hachures toit -->
    <pattern id="hatchRoof" patternUnits="userSpaceOnUse" width="10" height="12">
      <line x1="0" y1="6" x2="10" y2="6" stroke="#2a1a0a" stroke-width="2" opacity="0.8"/>
      <line x1="0" y1="0" x2="10" y2="0" stroke="#2a1a0a" stroke-width="1.2" opacity="0.6"/>
    </pattern>

    <filter id="sketchyHeavy" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.04" numOctaves="4" seed="42" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <filter id="sketchyMedium" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.07" numOctaves="3" seed="58" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- ======================================================= -->
  <!-- PUITS MÉDIÉVAL -->
  <!-- ======================================================= -->
  <g id="puits-medieval" transform="translate(3600, 1381.25) scale(0.75)">
    
    <!-- ===== BASE DU PUITS (cylindre en pierre) ===== -->
    <!-- Corps du puits (forme ovale pour simuler la perspective) -->
    <ellipse cx="0" cy="200" rx="80" ry="25" fill="#3a2a1a" opacity="0.3" filter="url(#sketchyMedium)"/>
    
    <path d="M -80,80 L -80,200 Q -80,225 0,225 Q 80,225 80,200 L 80,80 Q 80,55 0,55 Q -80,55 -80,80 Z" 
          fill="#9c968a" stroke="#2a1a0a" stroke-width="4" 
          filter="url(#sketchyHeavy)" opacity="0.95"/>
    <path d="M -80,80 L -80,200 Q -80,225 0,225 Q 80,225 80,200 L 80,80 Q 80,55 0,55 Q -80,55 -80,80 Z" 
          fill="url(#stoneTexture)" opacity="0.8"/>

    <!-- Ombre sur la droite du fut (volume cylindrique) -->
    <path d="M 35,75 Q 70,70 80,80 L 80,200 Q 80,222 40,224 Q 60,150 35,75 Z" fill="#3a2a1a" opacity="0.18"/>
    <path d="M -80,80 L -80,200 Q -80,215 -66,220 Q -72,150 -70,85 Z" fill="#fff6dc" opacity="0.12"/>

    <!-- Assises de pierre : courbes (arrondi du fut), joints verticaux resserres sur les cotes -->
    <g fill="none" stroke="#3a2a1a" stroke-width="1.5" opacity="0.65" filter="url(#sketchyMedium)">
      <path d="M -80,120 Q 0,146 80,120"/>
      <path d="M -80,160 Q 0,186 80,160"/>
      <path d="M -80,200 Q 0,226 80,200"/>
      <path d="M -50,93 L -50,129 M -10,99 L -10,133 M 30,98 L 30,131 M 66,90 L 66,123"/>
      <path d="M -70,135 L -70,166 M -32,140 L -32,174 M 10,142 L 10,177 M 50,138 L 50,172 M 76,128 L 76,162"/>
      <path d="M -60,177 L -60,208 M -18,182 L -18,215 M 24,182 L 24,215 M 62,176 L 62,207"/>
    </g>

    <!-- Ouverture du puits (intérieur sombre) -->
    <ellipse cx="0" cy="80" rx="60" ry="20" fill="#1a0f05" opacity="0.9"/>
    <!-- Reflet d'eau -->
    <ellipse cx="0" cy="85" rx="40" ry="12" fill="#4a6a8a" opacity="0.3" filter="url(#sketchyMedium)"/>

    <!-- Margelle (rebord du puits) : face avant epaisse -->
    <path d="M -82,75 L -82,88 Q -82,108 0,108 Q 82,108 82,88 L 82,75 Z" fill="#857e70" stroke="#2a1a0a" stroke-width="3" filter="url(#sketchyMedium)"/>
    <ellipse cx="0" cy="80" rx="80" ry="25" fill="none" stroke="#2a1a0a" stroke-width="5" filter="url(#sketchyMedium)"/>
    <ellipse cx="0" cy="75" rx="80" ry="25" fill="#b2ab9c" stroke="#2a1a0a" stroke-width="4" filter="url(#sketchyMedium)" opacity="0.9"/>
    <ellipse cx="0" cy="75" rx="80" ry="25" fill="url(#stoneTexture)" opacity="0.7"/>
    <!-- Ouverture visible au-dessus de la margelle (le seau y descend) -->
    <ellipse cx="0" cy="77" rx="60" ry="17" fill="#1a0f05" stroke="#2a1a0a" stroke-width="2.5" filter="url(#sketchyMedium)"/>
    <ellipse cx="0" cy="81" rx="38" ry="9" fill="#4a5a6a" opacity="0.35"/>

    <!-- ===== POTEaux EN BOIS ===== -->
    <g id="poteaux" filter="url(#sketchyMedium)">
      <!-- Poteau gauche -->
      <rect x="-70" y="-80" width="15" height="160" fill="#6b4a2e" stroke="#2a1a0a" stroke-width="3" rx="2"/>
      <rect x="-70" y="-80" width="15" height="160" fill="url(#hatchWood)" opacity="0.6"/>
      
      <!-- Poteau droit -->
      <rect x="55" y="-80" width="15" height="160" fill="#6b4a2e" stroke="#2a1a0a" stroke-width="3" rx="2"/>
      <rect x="55" y="-80" width="15" height="160" fill="url(#hatchWood)" opacity="0.6"/>
      
      <!-- Traverses horizontales -->
      <rect x="-70" y="-80" width="140" height="12" fill="#6b4a2e" stroke="#2a1a0a" stroke-width="3"/>
      <rect x="-70" y="-80" width="140" height="12" fill="url(#hatchWood)" opacity="0.6"/>
      
      <rect x="-70" y="0" width="140" height="10" fill="#6b4a2e" stroke="#2a1a0a" stroke-width="2"/>
    </g>

    <!-- ===== TOIT EN BOIS ===== -->
    <g id="toit-puits" filter="url(#sketchyMedium)">
      <!-- Toit à deux pentes -->
      <polygon points="-90,-80 0,-140 90,-80" 
               fill="#8c6b45" stroke="#2a1a0a" stroke-width="4" opacity="0.95"/>
      <polygon points="-90,-80 0,-140 90,-80" 
               fill="url(#hatchRoof)" opacity="0.8"/>
      
      <!-- Rangs de tuiles (bords : pentes du toit) -->
      <g stroke="#2a1a0a" stroke-width="1.5" opacity="0.5">
        <line x1="-75" y1="-90" x2="75" y2="-90"/>
        <line x1="-57" y1="-102" x2="57" y2="-102"/>
        <line x1="-39" y1="-114" x2="39" y2="-114"/>
        <line x1="-21" y1="-126" x2="21" y2="-126"/>
      </g>
      
      <!-- Épi de faîtage -->
      <line x1="0" y1="-140" x2="0" y2="-152" stroke="#2a1a0a" stroke-width="3"/>
      <circle cx="0" cy="-155" r="4" fill="#5a4a3a" stroke="#2a1a0a" stroke-width="1.5"/>
    </g>

    <!-- ===== TREUIL : axe (fixe). Corde, seau suspendu et manivelle sont animes en inline dans -->
    <!-- ville-medievale-croquis.svg (#puits-treuil), meme transform que #puits-medieval. ===== -->
    <g filter="url(#sketchyMedium)">
      <line x1="-58" y1="-70" x2="58" y2="-70" stroke="#5a4a3a" stroke-width="7" stroke-linecap="round"/>
      <line x1="-58" y1="-72" x2="58" y2="-72" stroke="#8a7050" stroke-width="2" stroke-linecap="round"/>
      <!-- Corde enroulee sur l'axe -->
      <g stroke="#a08a6a" stroke-width="2">
        <line x1="-12" y1="-75" x2="-10" y2="-65"/><line x1="-6" y1="-75" x2="-4" y2="-65"/>
        <line x1="0" y1="-75" x2="2" y2="-65"/><line x1="6" y1="-75" x2="8" y2="-65"/>
      </g>
    </g>

    <!-- ===== DÉTAILS SUPPLÉMENTAIRES ===== -->
    
    <!-- Mousse/lichen sur la pierre -->
    <g fill="#7a6238" opacity="0.4" filter="url(#sketchyMedium)">
      <ellipse cx="-60" cy="150" rx="15" ry="8"/>
      <ellipse cx="50" cy="180" rx="12" ry="6"/>
      <ellipse cx="-30" cy="200" rx="18" ry="7"/>
    </g>

    <!-- Herbe au pied du puits -->
    <g fill="#7a6238" opacity="0.5" filter="url(#sketchyMedium)">
      <ellipse cx="-100" cy="220" rx="25" ry="12"/>
      <ellipse cx="100" cy="220" rx="28" ry="14"/>
      <ellipse cx="0" cy="230" rx="35" ry="10"/>
    </g>

    <!-- Seau posé au sol (à côté) -->
    <g id="seau-sol" transform="translate(120, 180)" filter="url(#sketchyMedium)">
      <path d="M -12,0 L -10,30 Q -10,35 0,35 Q 10,35 10,30 L 12,0 Z" 
            fill="#6b4a2e" stroke="#2a1a0a" stroke-width="2"/>
      <path d="M -12,0 L -10,30 Q -10,35 0,35 Q 10,35 10,30 L 12,0 Z" 
            fill="url(#hatchWood)" opacity="0.7"/>
      <line x1="-11" y1="10" x2="11" y2="10" stroke="#2a1a0a" stroke-width="1.5"/>
      <line x1="-10" y1="20" x2="10" y2="20" stroke="#2a1a0a" stroke-width="1.5"/>
    </g>

    <!-- Ombre portée -->
    <ellipse cx="0" cy="225" rx="90" ry="20" fill="#3a2a1a" opacity="0.25" filter="url(#sketchyMedium)"/>

  </g>
</svg>